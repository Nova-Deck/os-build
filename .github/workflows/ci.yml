# novadeck CI — the offline suites. See also .github/workflows/overlay.yml (the package pipeline).
#
# WHERE THE IMAGE BUILD LIVES: .github/workflows/image.yml, called by release-sdcard.yml and
# release-bundle.yml. It used to be listed here as impossible, then as merely unwired; both old
# blockers are gone (the lock pins overlay rows to their SOURCES rather than to bytes no clean runner
# could reproduce, and overlay.yml publishes the packages so a cold runner retrieves instead of
# spending ~4h compiling under emulation). CI is now the ONLY producer of a release image, because a
# release build enforces packages/*/artifact.pin and locally built bytes cannot satisfy it.
#
# So this file covers the half that has always been cleanly CI-shaped: the offline suites. They are what
# caught a broken RAUC backend, an unarmed slot after a failed install, and a signing self-test that
# could have gone green while asserting nothing.
#
# NO SECRETS, ON PURPOSE. The signing job checks the committed keyring against the committed
# release certificate — both public, so this runs on a fork's pull request with access to nothing.
# The private half (does the signing KEY match that cert) announces itself as skipped here and runs
# where a PKIDIR is mounted. Bundle signing still needs exactly ONE secret, the release key, scoped
# to a protected environment rather than the repo; the CA key stays offline and never
# reaches a runner, which is what the two-level PKI bought us.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded push has nothing to tell us, and the signing job builds a container.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: offline suites (slot state, bootctl, post-install)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # 354 checks over the update path: the initramfs READS the slot state, novadeck-bootctl
      # WRITES it, and the post-install hook drives both while reformatting a partition. Pure
      # shell against temp-dir sandboxes — no build, no container, no root, no device.
      - run: make test

  # THE PIN GATE. packages/*/artifact.pin names the exact bytes a release build installs, and until
  # this job existed the only control on them was a convention ("the review of the pin-bump PR IS
  # the provenance claim", .github/workflows/overlay.yml). A convention cannot stop `make
  # pin-artifacts` from committing a sha for bytes that exist on one laptop — which is not caught
  # until CI's next release build fails, because CI builds from STORE artifacts and its bytes will
  # not be that laptop's.
  #
  # So: for every artifact.pin this change touches, pull that artifact from the overlay store and
  # compare. The pin-bump PR passes trivially — it pins what CI just published. A hand-written pin
  # passes iff those bytes are genuinely published, and publishing them is the honest act, so
  # forging this requires making the claim true. That is strictly stronger than the convention, and
  # it is why hand-writing a pin is now allowed (see `pin-artifacts` in the Makefile).
  #
  # WHY NOT "REJECT ANY PR THAT TOUCHES artifact.pin": the pin-bump job's entire output IS such a
  # diff, so that rule blocks the only legitimate producer. And gating on the AUTHOR is the wrong
  # axis — branch names are spoofable, anything that can open a PR as the bot can open any PR as the
  # bot, and nobody cares who typed the sha. Verifiability is the property worth checking.
  #
  # STILL NO SECRETS: pulling from the store needs no credentials (overlay.yml's retrieval job
  # asserts exactly that), so this runs on a fork's pull request like everything else here.
  pins:
    name: changed artifact pins name published bytes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The base ref has to be present to diff against, and a PR of any depth can move a pin.
          fetch-depth: 0

      # Two outputs, and the empty-list encoding is deliberate: `pins` empty with `run` true means
      # "could not tell what changed — check EVERY pin". A change of unknown shape must widen the
      # check, never silence it.
      - id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base=""
          if [ -n "${BASE_REF:-}" ]; then
            base="origin/$BASE_REF"
          elif [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          fi
          if [ -z "$base" ]; then
            echo "no diff base (first push, force-push or dispatch) — checking every pin" \
              >> "$GITHUB_STEP_SUMMARY"
            { echo "run=true"; echo "pins="; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --diff-filter=d drops DELETIONS: a pin a change removes is not a pin to verify, and
          # feeding the path anyway makes the checker die on a file that is gone on purpose.
          pins="$(git diff --name-only --diff-filter=d "$base...HEAD" -- 'packages/*/artifact.pin' | tr '\n' ' ')"
          if [ -z "$pins" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "no artifact.pin touched since $base — nothing to verify" >> "$GITHUB_STEP_SUMMARY"
          else
            { echo "run=true"; echo "pins=$pins"; } >> "$GITHUB_OUTPUT"
            echo "verifying against the store: $pins" >> "$GITHUB_STEP_SUMMARY"
          fi

      # The two failures mean OPPOSITE things and must not read the same. Exit 3 is
      # "the store never answered" — retry it. Anything else is "this pin is not what is
      # published" — do not retry it, fix the pin.
      - name: verify against the overlay store
        if: steps.changed.outputs.run == 'true'
        env:
          PINS: ${{ steps.changed.outputs.pins }}
        run: |
          set -uo pipefail
          rc=0
          # Intentional word-split: PINS is a space-separated path list, and every entry is
          # validated against packages/<name>/source.pin by the script before it is used.
          # shellcheck disable=SC2086
          packages/verify-pins.sh --store $PINS || rc=$?
          case "$rc" in
            0) ;;
            3) echo "::error::could not reach the overlay store — infrastructure, not a bad pin. Re-run this job." ;;
            *) echo "::error::a changed artifact.pin does not describe published bytes (see the log above)" ;;
          esac
          exit $((rc == 0 ? 0 : 1))

  signing:
    name: RAUC signing self-test
    runs-on: ubuntu-latest
    # Builds novadeck-build (build/Dockerfile) because the self-test signs real bundles and
    # verifies them through the shipped system.conf, which needs rauc. Uncached today: a layer
    # cache is worth adding when this becomes the slow part, not before.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Every case in here is a NEGATIVE — it feeds images/rauc/verify-signing.sh a deliberately
      # broken config or cert profile and requires it to go red. The failure mode of a check is
      # not "it breaks", it is "it stays green while asserting nothing".
      - run: make test-signing
