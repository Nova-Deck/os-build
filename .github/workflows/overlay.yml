# novadeck overlay package pipeline — prove the from-source packages still compile.
#
# WHAT THIS IS FOR. `make overlay` rebuilds ~8 holo packages from source with our patches. A change
# to a source.pin, a patch, or a PKGBUILD can break one of those builds, and without this the first
# thing that notices is a release build — 30 minutes in, hours after the change landed. So: build the
# packages a pull request actually touched, and nothing else.
#
# AND IT WARMS THE RELEASE CACHE ON main. A push to main runs `warm`: build-overlay.sh over the
# whole set, starting from main's previous actions/cache entry, saved back under a key over every
# overlay input. image.yml's build job restores that entry, so a release compiles only the packages
# whose inputs moved — CI's copy of the per-package input-hash stamps a dev box keeps under
# work/repo/<arch>/.stamps/. It has to be main that saves: a release runs on a TAG, and a cache a
# tag run saves is scoped to that tag, invisible to the next one.
#
# THIS IS NOT THE RETIRED ARTIFACT STORE. Until 2026-08-04 every package was pushed to GHCR keyed
# by packages/inputhash.sh, a bot PR carried each artifact's sha256 into packages/*/artifact.pin,
# and a release verified those bytes — ~1300 lines, two PATs, and a bot with write access to main,
# retired because on native arm the whole set cost only ~34 minutes (run 30490159103):
#
#     gtk2 7m   sddm 5m   mesa 5m   fex-emu 5m   gamescope 4m   scx-scheds 4m   mangohud 3m   rauc 1m
#
# Re-measured 2026-10-03, that is now 32-37 minutes of a ~65-minute build job, i.e. half of every
# card/OTA/installer run (runs 36821542543, 36821542656, 37076823558). The cache needs no registry,
# no secret, no pin and no bot: the stamps decide what is fresh, exactly as they do locally, and
# rootfs/fetchlock.sh still checks every `novadeck` lock row against the sources in the commit.
#
# WHY NATIVE ARM. The dev box compiles these under qemu; these runners are real aarch64, so
# build-overlay.sh's own binfmt probe passes and it never registers qemu or asks for --privileged.
# The indirection through vars.OVERLAY_RUNNER is the escape hatch if a hosted runner turns out too
# slow. Do NOT point it at a self-hosted runner while this repo is public.
#
# FORK PULL REQUESTS RUN THIS FINE. Nothing here needs a credential — no registry, no write token,
# `contents: read` and no secrets at all — so a fork's read-only token is sufficient.
#
# THE PER-PACKAGE PROOF MATRIX DOES NOT RUN ON A PUSH TO main: a PR already built what it changed,
# and `warm` compiles the full set there anyway (a direct-to-main package edit goes red in `warm`).
# Use workflow_dispatch to force a proof pass over a branch that never saw a PR.
name: overlay packages

on:
  # Same paths as pull_request; YAML anchors are not supported in workflow files, so keep the two
  # lists identical by hand. A push to main runs only `warm` (and the x86 proof jobs, whose caches
  # releases restore the same way) — the per-package matrix already ran on the PR.
  push:
    branches: [main]
    paths:
      - 'packages/*/source.pin'
      - 'packages/*/patches/**'
      - 'packages/*/PKGBUILD'
      - 'packages/build-overlay.sh'
      - 'packages/inputhash.sh'
      - 'build/builder.pin'
      - 'build/snapshot.pin'
      - 'build/lib-pins.sh'
      - '.github/workflows/overlay.yml'
      - 'packages/mesa-x86/**'
      - 'packages/lsfg-vk-x86/**'
      - 'packages/fex-rootfs/prebuilt.pin'
      - 'packages/mesa-android/**'
  pull_request:
    paths:
      - 'packages/*/source.pin'
      - 'packages/*/patches/**'
      - 'packages/*/PKGBUILD'
      - 'packages/build-overlay.sh'
      - 'packages/inputhash.sh'
      - 'build/builder.pin'
      - 'build/snapshot.pin'
      - 'build/lib-pins.sh'
      - '.github/workflows/overlay.yml'
      # mesa-x86 (the FEX-guest Turnip payload) is not an overlay package, but it is a package
      # build this workflow proof-compiles the same way. Its other inputs — the mesa PKGBUILD,
      # source.pin and patches — are already covered by the globs above; these two are the ones
      # only it cares about (build.sh asserts its snapshot against the fex-rootfs pin).
      - 'packages/mesa-x86/**'
      - 'packages/lsfg-vk-x86/**'
      - 'packages/fex-rootfs/prebuilt.pin'
      # mesa-android (the Android guest's bionic driver) for the same reason. Its extra input is
      # only its own dir -- unlike mesa-x86 it is NOT coupled to the fex-rootfs pin, because the
      # NDK supplies its whole target toolchain rather than the guest image.
      - 'packages/mesa-android/**'
  workflow_dispatch:
    inputs:
      packages:
        description: 'Space-separated package names to build (empty = all)'
        required: false
        default: ''

# A superseded PR push means the sources moved; there is no published state to corrupt, so
# cancelling mid-flight only ever loses compute. On main it would lose a half-warmed cache instead,
# and the next run starts from the previous one regardless, so queue there rather than cancel.
concurrency:
  group: overlay-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Cheap, and x86 on purpose: this only reads committed files and a git diff.
  plan:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
      mesa_x86: ${{ steps.plan.outputs.mesa_x86 }}
      lsfg_vk_x86: ${{ steps.plan.outputs.lsfg_vk_x86 }}
      mesa_android: ${{ steps.plan.outputs.mesa_android }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The base ref has to be present to diff against, and a PR of any depth can move a package.
          fetch-depth: 0

      # BEFORE anything is compiled. This is the same comparison over the same two committed inputs
      # that `make test` runs — see packages/verify-lock-rows.sh for why it needs no repo — and it
      # takes about a second. Duplicated on purpose: `ci` triggers on paths this workflow ignores, so
      # it catches a commit touching only rootfs/manifest.lock; this copy keeps the expensive
      # pipeline self-guarding rather than dependent on a sibling workflow having already gone red.
      - name: lock rows still name the sources in packages/
        run: packages/verify-lock-rows.sh

      # Every ${{ }} value reaches the shell as an ENVIRONMENT VARIABLE, never spliced into the
      # script text. PACKAGES is operator-supplied (workflow_dispatch), so splicing it would be a
      # command-injection hole; the others are ours, but the rule is only useful if it is absolute.
      - id: plan
        env:
          BASE_REF: ${{ github.base_ref }}
          PACKAGES: ${{ inputs.packages || '' }}
        run: |
          set -euo pipefail

          # dir -> the name build-overlay.sh --only matches on. They are equal for all 8 packages
          # today, but the pin's `name:` field is what the builder keys off (and what
          # verify-lock-rows.sh reads), so derive it rather than assuming the directory name.
          declare -A NAMEOF=()
          for pin in packages/*/source.pin; do
            d="$(dirname "$pin")"
            n="$(sed -n 's/^name:[[:space:]]*//p' "$pin" | head -1)"
            [ -n "$n" ] || { echo "::error::$pin: missing name"; exit 1; }
            NAMEOF["$d"]="$n"
          done
          # Only these dirs are compiled here. packages/{fex-rootfs,inputplumber,proton-*} carry a
          # prebuilt.pin and no sources, so there is nothing to build for them.
          [ ${#NAMEOF[@]} -gt 0 ] || { echo "::error::no packages/*/source.pin found"; exit 1; }

          all() { printf '%s\n' "${NAMEOF[@]}"; }

          sel=""
          why=""
          mx=false   # the mesa-x86 proof job (not an overlay package; see its job below)
          lx=false   # the lsfg-vk-x86 proof job, same idea (packages/lsfg-vk-x86)
          ma=false   # likewise the mesa-android proof job
          if [ -n "${PACKAGES:-}" ]; then
            # Validate against the tree rather than trusting the operator's spelling: a typo must be
            # an error, not a silently empty build set.
            for want in $PACKAGES; do
              # mesa-x86 is requestable by name but never enters the matrix — it is not built by
              # build-overlay.sh and has its own x86_64 job.
              if [ "$want" = "mesa-x86" ]; then mx=true; continue; fi
              if [ "$want" = "lsfg-vk-x86" ]; then lx=true; continue; fi
              if [ "$want" = "mesa-android" ]; then ma=true; continue; fi
              found=""
              for d in "${!NAMEOF[@]}"; do [ "${NAMEOF[$d]}" = "$want" ] && found=1; done
              [ -n "$found" ] || { echo "::error::no such package: $want"; exit 1; }
              sel+="$want"$'\n'
            done
            why="requested by hand"
          elif [ -z "${BASE_REF:-}" ]; then
            # A dispatch with no list. Unknown scope must WIDEN the check, never silence it --
            # which means EVERY out-of-matrix proof job too, not just the first one that existed.
            sel="$(all)"
            mx=true
            lx=true
            ma=true
            why="no diff base (dispatch) — building everything"
          else
            changed="$(git diff --name-only "origin/$BASE_REF...HEAD")"
            # A change to the builder itself, the hash formula, or the container it builds in can
            # break any package, so it selects all of them.
            if printf '%s\n' "$changed" | grep -qE '^(packages/build-overlay\.sh|packages/inputhash\.sh|build/builder\.pin|build/snapshot\.pin|build/lib-pins\.sh)$'; then
              sel="$(all)"
              why="the builder or its base image moved — building everything"
            else
              for d in "${!NAMEOF[@]}"; do
                printf '%s\n' "$changed" | grep -q "^$d/" && sel+="${NAMEOF[$d]}"$'\n'
              done
              why="changed since origin/$BASE_REF"
            fi
            # mesa-x86's inputs: its own dir, the host mesa sources it mirrors, and the fex-rootfs
            # pin its snapshot is asserted against (packages/mesa-x86/build.sh).
            printf '%s\n' "$changed" | grep -qE '^(packages/mesa-x86/|packages/mesa/|packages/fex-rootfs/prebuilt\.pin$)' && mx=true
            # lsfg-vk-x86's inputs: its own dir, the HOST PKGBUILD it reads the upstream tag from
            # (so the two arches cannot drift), and the fex-rootfs pin its snapshot is asserted
            # against (packages/lsfg-vk-x86/build.sh).
            printf '%s\n' "$changed" | grep -qE '^(packages/lsfg-vk-x86/|packages/lsfg-vk/PKGBUILD$|packages/fex-rootfs/prebuilt\.pin$)' && lx=true
            # mesa-android's inputs: its own dir plus the same host mesa sources. No fex-rootfs pin.
            printf '%s\n' "$changed" | grep -qE '^(packages/mesa-android/|packages/mesa/)' && ma=true
          fi

          sel="$(printf '%s' "$sel" | sed '/^$/d' | sort -u)"
          n=$(printf '%s' "$sel" | grep -c . || true)
          m=$(printf '%s' "$sel" | jq -R . | jq -sc '{pkg: .}')
          echo "matrix=$m" >> "$GITHUB_OUTPUT"
          # `any` drives the build job's `if`. An empty selection is a legitimate outcome (a PR that
          # only touches a prebuilt.pin, say) but GitHub still schedules a matrix job for an empty
          # list unless it is gated, and an empty-list job fails rather than skipping.
          echo "any=$([ "$n" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "mesa_x86=$mx" >> "$GITHUB_OUTPUT"
          echo "lsfg_vk_x86=$lx" >> "$GITHUB_OUTPUT"
          echo "mesa_android=$ma" >> "$GITHUB_OUTPUT"
          echo "$n package(s) to build — $why (mesa-x86 proof: $mx, lsfg-vk-x86 proof: $lx, mesa-android proof: $ma)" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$m" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build ${{ matrix.pkg }}
    needs: plan
    # Not on a push to main: plan has no diff base there and would select everything, which `warm`
    # builds anyway — in one job, into the cache releases actually read.
    if: needs.plan.outputs.any == 'true' && github.event_name != 'push'
    runs-on: ${{ vars.OVERLAY_RUNNER || 'ubuntu-24.04-arm' }}
    # 90, not the 360 this carried while it was sized for emulated builds: the slowest package
    # measured 7 minutes natively (gtk2). A job approaching this limit means something regressed
    # badly enough to be worth failing over rather than waiting out.
    timeout-minutes: 90
    strategy:
      # One package failing must not cancel the others: they are independent builds (each already
      # runs in its own fresh container, deliberately — a shared one once poisoned sddm's Qt6
      # resolution), and knowing which ones ALSO break is the useful part of a red run.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      # Same builder-tarball cache as image.yml's build job; lib-pins.sh re-verifies the sha256.
      - uses: actions/cache@v6
        with:
          path: work/builder
          key: builder-${{ hashFiles('build/builder.pin') }}

      # --no-index because the repo db is rebuilt from scratch over EVERYTHING present, and this
      # job holds one package. Nothing consumes this build — it exists to go red.
      - name: build
        env:
          PKG: ${{ matrix.pkg }}
        run: packages/build-overlay.sh --only "$PKG" --no-index

  # The overlay repo image.yml's build job restores — built here on main, because a cache saved
  # by a release's TAG run is scoped to that tag and no later run can read it (see the restore
  # step in image.yml). Starts from the previous main set via restore-keys, so a push that moved
  # one package rebuilds one package. A dispatch on main with no package list re-warms by hand.
  warm:
    name: warm the release overlay cache
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.packages == '')
    runs-on: ${{ vars.OVERLAY_RUNNER || 'ubuntu-24.04-arm' }}
    # The whole set cold is ~35 minutes; same headroom reasoning as `build`.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: work/builder
          key: builder-${{ hashFiles('build/builder.pin') }}

      # Key and path MUST stay identical to image.yml's "restore the overlay repo" step.
      - name: restore the overlay repo
        id: overlay-cache
        uses: actions/cache/restore@v6
        with:
          path: work/repo/aarch64
          key: overlay-aarch64-${{ hashFiles('packages/*/source.pin', 'packages/*/patches/**', 'packages/*/PKGBUILD', 'build/builder.pin', 'build/snapshot.pin') }}
          restore-keys: overlay-aarch64-

      - name: build the overlay packages
        run: packages/build-overlay.sh --prune-retired

      - name: save the overlay repo
        if: steps.overlay-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: work/repo/aarch64
          key: ${{ steps.overlay-cache.outputs.cache-primary-key }}

  # The FEX-guest Turnip payload (packages/mesa-x86) — same proof-build idea as the matrix
  # above, but on a NATIVE x86_64 runner: it compiles x86 code in a pinned x86 Arch container,
  # which the arm64 overlay runner could only run under qemu. Nothing consumes this build either;
  # it exists to go red before a release run pays for the same failure. Same cache as
  # image.yml's mesa-x86 job, so a green PR here usually makes the release job's build a hit.
  mesa-x86:
    name: build mesa-x86 (x86_64 guest)
    needs: plan
    if: needs.plan.outputs.mesa_x86 == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: work/mesa-x86
          key: mesa-x86-${{ hashFiles('packages/mesa-x86/**', 'packages/mesa/PKGBUILD', 'packages/mesa/source.pin', 'packages/mesa/patches/*.patch', 'packages/fex-rootfs/prebuilt.pin') }}
      - name: build
        run: make mesa-x86

  # The FEX-guest frame-generation layer (packages/lsfg-vk-x86) — same shape as mesa-x86 above and
  # for the same reason: it compiles x86 code in a pinned x86 Arch container, which the arm64
  # overlay runner could only manage under qemu. Its aarch64 SIBLING (packages/lsfg-vk) is a normal
  # overlay package and rides the matrix above; these two halves serve different games and neither
  # substitutes for the other, so both need to go red independently.
  lsfg-vk-x86:
    name: build lsfg-vk-x86 (x86_64 guest)
    needs: plan
    if: needs.plan.outputs.lsfg_vk_x86 == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: work/lsfg-vk-x86
          key: lsfg-vk-x86-${{ hashFiles('packages/lsfg-vk-x86/**', 'packages/lsfg-vk/PKGBUILD', 'packages/fex-rootfs/prebuilt.pin') }}
      - name: build
        run: make lsfg-vk-x86

  # The Android guest's bionic driver (packages/mesa-android) — same proof-build idea again, and
  # also on a NATIVE x86_64 runner, this time because Google ships NDK host binaries for
  # linux-x86_64 only. Nothing consumes it; it goes red here instead of 30 minutes into a release
  # run. Same cache key as image.yml's job, so a green PR usually makes that one a hit.
  mesa-android:
    name: build mesa-android (aarch64 bionic guest)
    needs: plan
    if: needs.plan.outputs.mesa_android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: work/mesa-android
          key: mesa-android-${{ hashFiles('packages/mesa-android/**', 'packages/mesa/PKGBUILD', 'packages/mesa/source.pin', 'packages/mesa/patches/*.patch') }}
      - name: build
        run: make mesa-android
