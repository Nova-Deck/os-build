# novadeck release update bundle — builds a RAUC bundle for a device already in the field.
#
# Separate from release-sdcard.yml on purpose: an update ships on its own cadence, and coupling it to
# card builds would mean either cutting cards nobody asked for or delaying updates until someone did.
# Both delegate to image.yml so the rootfs recipe exists once.
#
# ============================================================================================
# A TAG PRODUCES A SIGNED, SHIPPABLE BUNDLE. A DISPATCH PRODUCES AN UNSIGNED SMOKE TEST.
# ============================================================================================
# A device installs a bundle only if its signature chains to the keyring baked into its own image.
# Pushing `ota/v*` runs the build inside a PROTECTED environment where the release key is reachable;
# anything else builds with an ephemeral dev cert, which proves the bundle assembles, the verity
# hashes compute, the manifest is well formed and the pin gate passed — and which every device
# rejects. That is the intended difference, not a limitation.
#
# WHICH KEY ACTUALLY GOES TO CI, because this was mis-stated for a while and it matters. Not the
# 20-year root: ~/novadeck-pki/ca.key.pem stays offline and never leaves the workstation. CI gets
# release.cert.pem + release.key.pem — the SIGNING pair, whose cert expires 2028-10-04. Devices
# trust the CA, not that cert, so if CI is ever compromised the response is to mint a new release
# cert from the offline root and carry on. No device changes, no keyring update, no reflash. That
# is a materially smaller decision than "put the root of trust in GitHub", which is what the old
# wording here described.
#
# SETUP, once per repo (nothing below works until this is done — the build silently falls through
# to the dev cert, which is the safe direction):
#
#   1. Create a PROTECTED environment (repo settings -> Environments) named `release-signing`, with
#      required reviewers and a branch/tag restriction. The environment is what makes signing an
#      APPROVED action rather than an available one. Override the name with the SIGNING_ENVIRONMENT
#      repo variable if you want a different one.
#   2. Add RAUC_CERT_PEM + RAUC_KEY_PEM to THAT environment. NOT to repo-wide secrets — repo-wide
#      secrets reach every workflow_dispatch and the gate would evaporate with no visible change.
#   3. Nothing else. image.yml takes an `environment` input and declares it on its build job (a
#      caller cannot attach an environment to a reusable workflow's job from outside), and the
#      `build` job below passes it only on a tag.
#
# UNVERIFIED UNTIL THE FIRST RUN: that `environment: ''` means "no environment" rather than an error.
# It is the documented behaviour and release-sdcard.yml depends on it too. If it turns out to fail,
# the fix is two jobs in image.yml picked with an `if:` — not a change to the model here.
# WHERE THE BUNDLE GOES. Not to R2, and not to a GitHub release asset: bundles are served from the
# Oracle Cloud instance devices fetch their OTAs from. That is a different host with different
# credentials from the card bucket, and deliberately so — a card is downloaded by a person with a
# browser, a bundle is fetched by a device with a keyring. The transport is ota/publish-bundle.sh
# and the `publish` job below calls it.
#
# THAT JOB IS INERT TODAY, and it fails closed twice over rather than being commented out:
#
#   1. publish-bundle.sh verifies the bundle against the CA in every device's keyring BEFORE it
#      moves a byte, and this workflow can only produce dev-cert bundles (see above). So it would
#      reject its own artifact.
#   2. The SSH secrets do not exist, and the job announces that as a skip rather than a pass.
#
# It goes live with the signing decision described above — the same decision, not a second one. A
# signed bundle with no way to publish it, or a publish path that only ever carries unsigned ones,
# are both half a channel. Until then, publishing is done from the workstation where the release key
# actually lives; see docs/ota.md.
name: release bundle

# TAG NAMESPACE: `ota/v*`. Bundles and cards ship on independent cadences — an update goes out far
# more often than a card — so each gets its own namespace instead of sharing a bare `v*`. Until this
# trigger existed, release-sdcard.yml owned `v*` alone, so tagging a release built a CARD and never
# a bundle: exactly backwards. `ota/v1.3.0` and `card/v1.3.0` on one commit are the same OS shipped
# two ways; a run of ota tags with no card between them is the normal state.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Bundle version (default: empty — the image stamps itself `dev` and the bundle is named after its build timestamp)'
        required: false
        type: string
        default: ''
  push:
    tags:
      - 'ota/v*'

permissions:
  contents: read

jobs:
  # Same reason release-sdcard.yml has one: GitHub expressions cannot strip the `ota/` prefix, so the
  # version is derived in a shell step and image.yml keeps taking a bare version string.
  prep:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            v="$INPUT_VERSION"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            v="${REF_NAME#ota/}"
          else
            # Empty is legitimate here, unlike the card path: the image then calls itself `dev` and
            # genbundle.sh names the bundle after its build timestamp, which is still unique per
            # build. A dispatch with no version is a smoke test, and it is labelled as one.
            v=""
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  # SIGNED ON A TAG, unsigned on a dispatch, and the difference is the environment rather than an
  # `if:` on a signing step. A tag push is the deliberate act — someone decided this commit ships —
  # and it is the only path that names the protected environment, so it is the only path where the
  # release key is reachable and the only one that waits for a reviewer. A bare workflow_dispatch
  # stays what it was: a smoke test that proves the bundle assembles, signed with an ephemeral dev
  # cert, rejected by every device.
  #
  # `secrets: inherit` is safe precisely because the signing secrets are ENVIRONMENT-scoped. A job
  # that does not name the environment inherits nothing that matters, and image.yml falls through to
  # the dev cert. Put RAUC_CERT_PEM/RAUC_KEY_PEM in repo-wide secrets and this whole gate evaporates
  # silently — every dispatch would sign.
  build:
    needs: prep
    uses: ./.github/workflows/image.yml
    secrets: inherit
    with:
      artifact: bundle
      version: ${{ needs.prep.outputs.version }}
      environment: ${{ github.ref_type == 'tag' && (vars.SIGNING_ENVIRONMENT || 'release-signing') || '' }}

  # The upload half. See the header: this is deliberately inert until the release key reaches a
  # protected environment, and it is written rather than commented out so that decision is a matter
  # of adding secrets, not of writing a job under time pressure on release day.
  publish:
    needs: build
    # Only a tag can have produced a signed bundle, and only a signed bundle can be published. On a
    # dispatch this job would exist solely to fail its own keyring gate, so it does not run at all —
    # a skipped job that is always skipped teaches people to ignore skipped jobs.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Two secrets, and the job stops here without both. A publish that silently no-ops is worse
      # than one that fails: the tag looks shipped and the fleet never sees it.
      - name: check for publishing credentials
        id: creds
        env:
          KEY: ${{ secrets.OTA_SSH_KEY }}
        run: |
          if [ -z "${KEY:-}" ]; then
            echo "::notice::OTA_SSH_KEY is not set — nothing was published."
            echo "::notice::This is expected: CI can only build dev-cert bundles today, and"
            echo "::notice::ota/publish-bundle.sh would reject one anyway. See this file's header."
            echo "ready=no" >> "$GITHUB_OUTPUT"
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: fetch the bundle
        if: steps.creds.outputs.ready == 'yes'
        uses: actions/download-artifact@v4
        with:
          name: novadeck-bundle
          path: out/images

      # $RUNNER_TEMP, never the workspace, for the reason image.yml already keeps the RAUC key
      # there: anything left in the repo tree gets swept into artifacts and caches.
      - name: publish to the update server
        if: steps.creds.outputs.ready == 'yes'
        env:
          OTA_SSH_KEY: ${{ secrets.OTA_SSH_KEY }}
          NOVADECK_OTA_HOST: ${{ vars.OTA_HOST || 'updates.novadeck.cloud-ip.cc' }}
          NOVADECK_OTA_USER: ${{ vars.OTA_USER || 'ubuntu' }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/ota_key"
          printf '%s\n' "$OTA_SSH_KEY" > "$key"
          chmod 600 "$key"
          trap 'shred -u "$key" 2>/dev/null || rm -f "$key"' EXIT
          bundle="$(ls out/images/novadeck-*.raucb)"
          # Build the toolchain image so publish-bundle.sh's keyring gate runs against the PINNED
          # rauc (build/Dockerfile, RAUC_VERSION) rather than whatever the runner's archive holds.
          # Not a detail: ubuntu-latest ships a rauc old enough to predate verity bundle support, so
          # `apt-get install rauc` here would give a gate that fails on every bundle we produce —
          # indistinguishable, from the log, from a genuinely bad signature.
          docker build -t novadeck-build -f build/Dockerfile build
          NOVADECK_OTA_SSH_KEY="$key" ota/publish-bundle.sh "$bundle"
