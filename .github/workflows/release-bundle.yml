# novadeck release update bundle — builds a RAUC bundle for a device already in the field.
#
# Separate from release-sdcard.yml on purpose: an update ships on its own cadence, and coupling it to
# card builds would mean either cutting cards nobody asked for or delaying updates until someone did.
# Both delegate to image.yml so the rootfs recipe exists once.
#
# ============================================================================================
# THIS PRODUCES AN UNSIGNED (dev-cert) BUNDLE. IT IS NOT A SHIPPABLE UPDATE.
# ============================================================================================
# A device only installs a bundle whose signature chains to the keyring baked into its own image, so
# what this builds is a SMOKE TEST: it proves the bundle assembles, the verity hashes compute, the
# manifest is well formed and the pin gate passed. Every device will reject the result.
#
# WHY IT STOPS THERE, deliberately. Signing needs the release private key — the 20-year root of
# trust, currently at ~/novadeck-pki, deliberately outside the repo and invisible to the build
# container. Putting it into GitHub secrets is a real security decision that has not been made, and
# guessing at it is how a root of trust ends up somewhere nobody chose to put it.
#
# TO FINISH THIS, once that decision is made:
#
#   1. Create a PROTECTED environment (repo settings -> Environments), e.g. `release-signing`, with
#      required reviewers and a branch restriction. Without one, any workflow_dispatch reaches the
#      key. The environment is what makes signing an approved action rather than an available one.
#   2. Add RAUC_CERT_PEM + RAUC_KEY_PEM to THAT environment, not to repo-wide secrets.
#   3. In image.yml, add an `environment` input and set it on the build job. It has to be declared
#      there because that is the job the secret is used in — a caller cannot attach an environment to
#      a reusable workflow's job from outside. Verify on the first run that an empty value means "no
#      environment" for the sdcard path, or give image.yml two jobs and pick with an `if:`.
#   4. Pass `secrets: inherit` from a signed job here.
#
# image.yml ALREADY accepts RAUC_CERT_PEM / RAUC_KEY_PEM and signs with them when both are present,
# so step 4 is the only change on this side. It warns loudly when they are absent rather than
# quietly producing something that looks shippable.
# WHERE THE BUNDLE GOES. Not to R2, and not to a GitHub release asset: bundles are served from the
# Oracle Cloud instance devices fetch their OTAs from. That is a different host with different
# credentials from the card bucket, and deliberately so — a card is downloaded by a person with a
# browser, a bundle is fetched by a device with a keyring. This workflow currently stops at a
# workflow artifact and the upload to that instance is done from there; wiring it in is the open
# half of this channel, alongside the signing key below.
name: release bundle

# TAG NAMESPACE: `ota/v*`. Bundles and cards ship on independent cadences — an update goes out far
# more often than a card — so each gets its own namespace instead of sharing a bare `v*`. Until this
# trigger existed, release-sdcard.yml owned `v*` alone, so tagging a release built a CARD and never
# a bundle: exactly backwards. `ota/v1.3.0` and `card/v1.3.0` on one commit are the same OS shipped
# two ways; a run of ota tags with no card between them is the normal state.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Bundle version (default: empty — the image stamps itself `dev` and the bundle is named after its build timestamp)'
        required: false
        type: string
        default: ''
  push:
    tags:
      - 'ota/v*'

permissions:
  contents: read

jobs:
  # Same reason release-sdcard.yml has one: GitHub expressions cannot strip the `ota/` prefix, so the
  # version is derived in a shell step and image.yml keeps taking a bare version string.
  prep:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            v="$INPUT_VERSION"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            v="${REF_NAME#ota/}"
          else
            # Empty is legitimate here, unlike the card path: the image then calls itself `dev` and
            # genbundle.sh names the bundle after its build timestamp, which is still unique per
            # build. A dispatch with no version is a smoke test, and it is labelled as one.
            v=""
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  unsigned:
    needs: prep
    uses: ./.github/workflows/image.yml
    with:
      artifact: bundle
      version: ${{ needs.prep.outputs.version }}
