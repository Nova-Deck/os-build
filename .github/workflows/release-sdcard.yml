# novadeck release SD card — a flashable image for bringing a device up from scratch.
#
# Separate from release-bundle.yml because the two are wanted at different cadences: a card is what
# you flash onto a new device or after a wipe, a bundle is what updates one already in the field.
# Both delegate to image.yml so the rootfs recipe exists once.
#
# TAG NAMESPACE: `card/v*`, NOT a bare `v*`. The two artifacts have independent cadences — a bundle
# ships far more often than a card — so they get independent tag namespaces rather than sharing one
# and hoping. This also fixes a real inversion: while this workflow triggered on `v*` and
# release-bundle.yml had no tag trigger at all, tagging a release built a card and NEVER a bundle,
# which is backwards from how the two actually ship. `card/v1.3.0` and `ota/v1.3.0` on the same
# commit mean the same OS delivered two ways; a run of ota tags with no card between them is normal.
#
# NEEDS NO SIGNING KEY. Nothing here is signed — an sdcard is flashed over USB by someone holding
# the device, so there is no signature for anything to verify. It DOES need the R2 credentials to
# publish, but those are push-only credentials to a public bucket, not a root of trust.
#
# THE R2 CREDENTIALS ARE STILL GATED, since 2026-08-04, in the `release-cards` environment — not
# repo-wide. "Not a root of trust" bounds the damage; it does not make the credential free. Blank is
# what an unauthorised caller gets, and `rclone purge`-based retention (KEEP=1, images/publish-card.sh)
# means these are DESTRUCTIVE, not merely additive: they can delete the published card, not just add
# one. Repo-wide, any `workflow_dispatch` by anyone with write access reached them.
#
# Its policy allows the `card/v*` tags AND `main`, because a dispatch with publish:true is a
# supported way to cut a card and a tag-only policy would reject it at the gate. Both still require a
# reviewer, so this is strictly tighter than the repo-wide arrangement it replaces, not a new door.
#
# A LOCAL `make sdcard` PRODUCES THE SAME KIND OF IMAGE. It used to fail an artifact-pin gate by
# design, which made flashing this workflow's output the only way to see a real release image; that
# gate was retired 2026-08-04. What this workflow still has that a dev box does not is the R2
# credentials and a version string tied to a tag.
name: release sdcard

on:
  # Manual by default: a card is cut when someone wants one, not on every push.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for this card (default: date-shortsha)'
        required: false
        type: string
        default: ''
      publish:
        description: 'Upload to R2 and cut a GitHub Release (off for a plain test build)'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'card/v*'

permissions:
  contents: read

jobs:
  # The version has to be computed in a shell step, not an expression: GitHub's expression language
  # has no string-replace, so `card/v1.3.0` -> `1.3.0` cannot be done inline. Keeping it here rather
  # than inside image.yml leaves image.yml's contract simple — it takes a bare version string and
  # knows nothing about our tag scheme.
  prep:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            v="$INPUT_VERSION"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            v="${REF_NAME#card/}"
          else
            # A dispatch with no version still needs to name itself, or the bucket prefix and the
            # image's own /etc/novadeck-release would both say "unset".
            v="$(date -u +%Y%m%d)-$(echo "$GITHUB_SHA" | cut -c1-7)"
          fi
          # This becomes a URL path segment; refuse anything that could escape it here rather than
          # discovering it after a four-hour build.
          case "$v" in
            *[!A-Za-z0-9._-]*) echo "::error::version '$v' has characters that do not belong in a URL path"; exit 1 ;;
          esac
          # A tag always publishes. A dispatch publishes only when asked, so the common case —
          # "does this still build?" — cannot overwrite a released card or spend the free tier.
          if [ "$GITHUB_REF_TYPE" = tag ] || [ "${INPUT_PUBLISH:-false}" = true ]; then
            p=true
          else
            p=false
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "publish=$p" >> "$GITHUB_OUTPUT"
          echo "version=$v publish=$p" >> "$GITHUB_STEP_SUMMARY"

  sdcard:
    needs: prep
    uses: ./.github/workflows/image.yml
    # `secrets: inherit`, NOT the explicit `R2_*: ${{ secrets.R2_* }}` mapping this used to carry,
    # and the difference is the whole point of moving those secrets into an environment.
    #
    # An explicit mapping evaluates in the CALLER's context — here, in this job — and a job that
    # calls a reusable workflow CANNOT declare an environment. So an environment-scoped secret would
    # resolve to the EMPTY STRING right here, be handed to image.yml as an empty string, and the
    # build would run for four hours before dying at the upload step with blank credentials. No
    # error at the point of evaluation, no warning, and the secret plainly visible in repo settings.
    #
    # `inherit` defers resolution to the CALLED workflow's job, which does name the environment (via
    # the input below), so the secrets resolve there and only there. Same mechanism the signing key
    # already uses in release-bundle.yml. This pairing is load-bearing: `inherit` without the
    # environment input, or the environment input without `inherit`, both yield blank credentials.
    secrets: inherit
    with:
      artifact: sdcard
      version: ${{ needs.prep.outputs.version }}
      publish: ${{ needs.prep.outputs.publish == 'true' }}
      # Named only when this run actually publishes, and PUBLISH IS NOT THE SAME AS TAG here — unlike
      # the bundle path, a `workflow_dispatch` with publish:true is a supported way to cut a card, and
      # gating on `github.ref_type == 'tag'` would hand that path empty credentials. Gate on the thing
      # that decides whether R2 is touched at all.
      #
      # The common case — a dispatch answering "does this still build?" — names no environment, so it
      # needs no approval and cannot reach the credentials. It also cannot reach the upload step at
      # all: image.yml guards that on `inputs.publish`.
      #
      # `release-cards`, not `release-signing`: that environment's deployment policy is `ota/v*`, so
      # reusing it would reject every `card/v*` tag outright. Two artifacts, two cadences, two gates.
      environment: ${{ needs.prep.outputs.publish == 'true' && (vars.CARDS_ENVIRONMENT || 'release-cards') || '' }}

  # The Release carries only small files — checksums, the provenance pins, and the link. The card
  # itself is well over GitHub's 2 GiB per-asset cap and lives in R2; see images/publish-card.sh.
  #
  # A separate job so `contents: write` is scoped to it alone: the long build job, which runs far
  # more third-party code, stays read-only.
  release:
    needs: [prep, sdcard]
    if: needs.prep.outputs.publish == 'true' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: novadeck-sdcard-meta
          path: meta
      - name: cut the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prep.outputs.version }}
          CARD_URL: ${{ needs.sdcard.outputs.card_url }}
        run: |
          set -euo pipefail
          {
            echo "## novadeck card \`$VERSION\`"
            echo
            echo 'The image is ~9 GiB — past GitHub'"'"'s 2 GiB release-asset limit — so it is served from R2:'
            echo
            echo '```bash'
            echo "curl -LO $CARD_URL"
            echo "gzip -dc $(basename "$CARD_URL") | sudo dd of=/dev/sdX bs=4M status=progress"
            echo '```'
            echo
            echo 'Check it against `sha256sums.txt` below before flashing. `manifest.lock` records'
            echo 'every package this card was built from — third-party ones by sha256, ours by the'
            echo 'digest of the sources they were compiled from in this run.'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "novadeck card $VERSION" \
            --notes-file notes.md \
            meta/sha256sums.txt meta/provenance/manifest.lock
