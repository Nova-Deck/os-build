# novadeck Steam-seed publisher — the /home tree the NETWORK INSTALLER downloads.
#
# WHY THIS IS CI AND NOT A WORKSTATION SCRIPT, which is the same answer image.yml gives for every
# release artifact: the CREDENTIALS. Writing to the update server needs OTA_SSH_KEY, which lives in a
# protected environment and is reachable from no dev box. Packing a seed locally is fine and
# supported (`make steam-seed-artifact`, then serve it off a laptop with install/hw-install.sh) —
# putting one in front of real devices is not.
#
# WHAT IT PUBLISHES, and why it has no version and no channel. install/novadeck-install verifies the
# seed against a sha256 BAKED INTO THE MEDIUM and refuses on a mismatch, and install/release-info
# builds the URL out of that same pin:
#
#     <OTA_URL>/seed/steam-seed-<pin>.tar.zst
#
# So the artifact is content-addressed: its name is its hash, one flat directory holds every seed
# ever published, and nothing supersedes anything. A medium built six months ago names exactly one
# seed and will name it forever, which is why ota/publish-seed.sh does not prune by default.
#
# THE PIN IS AN OUTPUT OF THIS RUN, NOT AN INPUT TO IT, and that is the ordering that matters: this
# workflow prints the sha to bake, and an installer image built afterwards passes it as
# NOVADECK_SEED_SHA256. Committing a pin file first and publishing to match it is the same shape
# backwards — there would be a window where the tracked hash names bytes nobody has uploaded, and a
# medium built in that window refuses at the seed step, on a device whose Android data is gone.
#
# NO ARTIFACT UPLOAD. The output is ~1.5 GB and its whole purpose is to be on the update server;
# copying it into GitHub's artifact store too would cost the upload twice over to produce a second
# copy nothing fetches. The pin in the job summary is what a later build needs.
#
# DISPATCH ONLY, no tag trigger. A seed tracks VALVE's cadence (steam-seed/STEAM_SEED.pin names two
# live rolling channels), not ours, so there is no repo tag that means "the seed changed" — and
# re-running this when nothing has changed is free: pack-seed.sh is deterministic, so an unchanged
# tree packs to the same name and publish-seed.sh finds it already there and exits.
name: release-seed

on:
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time. Two runs of the SAME seed are harmless (identical bytes, identical name, the
# second one no-ops), but two runs mid-upload would rsync --inplace to the same .part path and
# neither would fail — they would interleave, and the server-side hash check would then reject bytes
# that were fine before they were mixed.
concurrency:
  group: release-seed
  cancel-in-progress: false

jobs:
  publish:
    # NATIVE ARM64. steam-seed/fetch-steam-seed.sh runs Steam's own updater in an arm64 container to
    # self-install the complete client tree; on an x86 runner that is qemu emulation of a ~3 GB
    # install, which is what the fetcher's 1800s bootstrap timeout is sized against. Here it is
    # native. Same runner family as image.yml's build job.
    runs-on: ${{ vars.OVERLAY_RUNNER || 'ubuntu-24.04-arm' }}
    # THE SAME PROTECTED ENVIRONMENT AS THE BUNDLE PUBLISH, and declaring it is not bookkeeping:
    # OTA_SSH_KEY is scoped to it, and a job that does not name the environment sees the secret as
    # the EMPTY STRING — not an error, not a warning. The creds step below then fails loudly rather
    # than letting the run go green having published nothing.
    environment: ${{ vars.SIGNING_ENVIRONMENT || 'release-signing' }}
    # The fetch is a full Steam self-install from Valve's CDN; the pack is zstd -19 over 3.3 GB.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      # The seed fetch is a Steam self-install, so this is a download of Valve's live publicbeta
      # build — not something the repo pins byte-for-byte. steam-seed/STEAM_SEED.pin names the
      # channels; the fetcher refuses an incomplete tree, and pack-seed.sh checks the completeness
      # marker again before it packs one.
      - name: fetch the Steam seed
        run: make steam-seed-sync

      - name: pack it
        id: pack
        run: |
          set -euo pipefail
          steam-seed/pack-seed.sh
          sha="$(cat out/steam-seed/steam-seed.sha256)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "artifact=out/steam-seed/steam-seed-$sha.tar.zst" >> "$GITHUB_OUTPUT"

      # The job stops without the secret rather than silently no-opping: a publish that quietly does
      # nothing means a pin gets baked into media for a seed that is not on the server, and every one
      # of those media stops at the seed step.
      - name: check for publishing credentials
        env:
          KEY: ${{ secrets.OTA_SSH_KEY }}
        run: |
          if [ -z "${KEY:-}" ]; then
            echo "::error::OTA_SSH_KEY is empty — nothing was published, and no medium may be built"
            echo "::error::against this seed. The secret lives in the"
            echo "::error::'${{ vars.SIGNING_ENVIRONMENT || 'release-signing' }}' environment, and an"
            echo "::error::environment-scoped secret reads as empty in any job that does not declare"
            echo "::error::that environment — check this job's environment: line before assuming the"
            echo "::error::secret itself is missing."
            exit 1
          fi

      # $RUNNER_TEMP, never the workspace: anything left in the repo tree gets swept into artifacts
      # and caches. Same handling as release-bundle.yml's publish job, and the same principal —
      # `otapub`, a no-sudo account whose write access stops at the docroot (ota/setup-ci-user.sh).
      - name: publish to the update server
        env:
          OTA_SSH_KEY: ${{ secrets.OTA_SSH_KEY }}
          NOVADECK_OTA_HOST: ${{ vars.OTA_HOST || 'updates.novadeck.cloud-ip.cc' }}
          NOVADECK_OTA_USER: ${{ vars.OTA_USER || 'otapub' }}
          ARTIFACT: ${{ steps.pack.outputs.artifact }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/ota_key"
          printf '%s\n' "$OTA_SSH_KEY" > "$key"
          chmod 600 "$key"
          trap 'shred -u "$key" 2>/dev/null || rm -f "$key"' EXIT
          NOVADECK_OTA_SSH_KEY="$key" ota/publish-seed.sh "$ARTIFACT"

      # THE OUTPUT OF THIS RUN. An installer image is built against a pin, and this is where the pin
      # comes from — there is no file in the repo to read it out of, on purpose.
      - name: the pin to build media against
        env:
          SHA: ${{ steps.pack.outputs.sha }}
          HOST: ${{ vars.OTA_HOST || 'updates.novadeck.cloud-ip.cc' }}
        run: |
          {
            echo "### Steam seed published"
            echo
            echo "    https://$HOST/seed/steam-seed-$SHA.tar.zst"
            echo
            echo "Build an installer medium that fetches it with:"
            echo
            echo "    NOVADECK_SEED_SHA256=$SHA make installer"
            echo
            echo "Any medium built with a different pin will not use this seed — it derives the URL"
            echo "from its own pin, and this one stays on the server for the media that name it."
          } >> "$GITHUB_STEP_SUMMARY"
