# Daily upstream watchers. NO job bumps anything — each detects that an upstream we track moved
# and opens ONE issue assigned to the maintainer to run the manual revalidation drill.
# All are deliberately stateless:
#   - the rootfs, Proton and mesa jobs take their baseline FROM REPO STATE (the pin / the PKGBUILD),
#     so there is no side channel to keep in step and a bump silences its own watcher;
#   - the compat-tool job carries its state in the issue TITLE (searched across open AND closed
#     issues, so closing an issue marks that build as handled and it is never re-filed).
# Every job FAILS when its upstream parse yields nothing: a watcher that cannot see must go red,
# not stay quietly green.
#
# Issue titles are the dedupe key everywhere (searched across open AND closed), so a watcher that
# reports a version we decide NOT to take is answered by closing its issue once.
name: upstream-watch

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  issues: write
  contents: read

env:
  ASSIGNEE: loki666

jobs:
  fex-rootfs:
    name: FEX guest RootFS update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare upstream index against the pin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pinned="$(sed -n 's/^version:[[:space:]]*//p' packages/fex-rootfs/prebuilt.pin | head -1)"
          [ -n "$pinned" ] || { echo "::error::prebuilt.pin has no version: field"; exit 1; }

          # Schema-agnostic on purpose: pull every ArchLinux/<date>/ArchLinux.ero mention out of
          # the index and take the newest date. A schema change that hides them goes red here.
          latest="$(curl -fsSL --retry 3 https://rootfs.fex-emu.gg/RootFS_links.json \
            | grep -oE 'ArchLinux/[0-9]{4}-[0-9]{2}-[0-9]{2}/ArchLinux\.ero' \
            | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | sort -u | tail -1)"
          [ -n "$latest" ] || { echo "::error::no ArchLinux.ero entries found in RootFS_links.json"; exit 1; }

          echo "pinned=$pinned latest=$latest"
          if [ "$latest" \> "$pinned" ]; then
            title="upstream: FEX guest RootFS $latest published (pinned: $pinned)"
            if [ "$(gh issue list --state all --search "in:title \"$title\"" --json number --jq length)" -gt 0 ]; then
              echo "issue already filed for $latest"; exit 0
            fi
            gh issue create --title "$title" --assignee "$ASSIGNEE" \
              --label P2 --label area/steam --body "$(cat <<EOF
          Upstream published a newer FEX guest RootFS: **$latest** (we pin **$pinned**).
          Index: https://rootfs.fex-emu.gg/RootFS_links.json

          Bump drill (see the fex-guest-rootfs-bump notes — a bump drags more than the pin):
          - [ ] \`packages/fex-rootfs/prebuilt.pin\`: version + url + sha256 together; verify the download against upstream's XXH3 first
          - [ ] \`packages/fex-emu\` sysroot pins (guest thunks compile against the guest's packages) + overlay rebuild
          - [ ] \`packages/mesa-x86/builder.pin\`: snapshot must match the new guest date (build.sh asserts it)
          - [ ] verify by extracting the .ero, not by boot: locales (C.utf8-only?), ICD library_path shape, manifest presence
          - [ ] revalidate the mesa-x86 relative-ICD workaround: check a compat-tool title's maps for libvulkan_freedreno — the failure mode is a SILENT GL fallback, "the game runs" proves nothing
          - [ ] HW pass on the two canonical native x86 titles (Super Meat Boy, Parking Garage Rally Circuit)
          EOF
          )"
          else
            echo "pin is current"
          fi

  fex-compat-tool:
    name: FEX compat tool release channel
    runs-on: ubuntu-latest
    steps:
      - name: Check the app change number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Valve's FEX Steam Play tool, app 3127680. Anonymous appinfo exposes NO depots/branches
          # section for this app (verified 2026-08-19), so the public-branch buildid is not
          # reachable without credentials. What IS visible is the PICS CHANGE NUMBER in
          # app_info_print's header line, which bumps on every app change — builds included,
          # store metadata too, so an issue can occasionally be a metadata-only bump; the issue
          # body says how to tell. app_info_print runs twice because the first query of a
          # steamcmd session often returns before the appinfo cache is populated.
          out="$(docker run --rm steamcmd/steamcmd:latest \
            +login anonymous +app_info_update 1 +app_info_print 3127680 +app_info_print 3127680 +quit 2>&1)"
          change="$(printf '%s\n' "$out" | grep -m1 -oE 'change number : [0-9]+' | grep -oE '[0-9]+' || true)"
          if [ -z "$change" ]; then
            echo "::group::steamcmd output (parse failed)"; printf '%s\n' "$out" | tail -40; echo "::endgroup::"
            echo "::error::could not parse the change number for app 3127680"; exit 1
          fi

          echo "change number=$change"
          title="upstream: FEX compat tool changed (change $change)"
          if [ "$(gh issue list --state all --search "in:title \"$title\"" --json number --jq length)" -gt 0 ]; then
            echo "change $change already filed"; exit 0
          fi
          gh issue create --title "$title" --assignee "$ASSIGNEE" \
            --label P2 --label area/steam --body "$(cat <<EOF
          Valve's FEX compat tool (app 3127680) changed: PICS change number **$change**. This
          fires on ANY app change — check https://steamdb.info/app/3127680/history/ first to see
          whether it is a real public-branch build or metadata only (anonymous appinfo hides the
          buildid, so this watch cannot tell them apart). For a real build, re-check every
          behavior we verified against the previous one:

          - [ ] one-slot \`FEX_APP_CONFIG\`: with tweaks enabled, does the tool still skip its own config generation? (environ of the FEX process names OUR ~/.cache/novadeck-fex file; no /tmp/fex-app-config-*.json)
          - [ ] \`STEAM_COMPAT_FEX_CONFIG\` parsing: tri-state (Key:1/Key:0/absent) or the old absent-means-0? game-launch's steam_curated() must match (#50)
          - [ ] provider ICD handling: does an as-shipped Vulkan title load libvulkan_freedreno from /run/gfx, or silently fall back to GL? (maps, never "the game runs")
          - [ ] thunk engagement: did the /run/gfx + pv-overrides overlay prefixes (FEX-Emu/FEX#5821) reach release? Force Vulkan on PGRC and read the maps
          - [ ] the #49-class lib64 prefix behavior in their shipped FEX binary

          Close this issue when the checks are done (or immediately for a metadata-only bump);
          a closed issue marks this change number handled.
          EOF
          )"

  proton:
    name: Proton compat tool release (${{ matrix.pkg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkg: proton-cachyos
            repo: CachyOS/proton-cachyos
            # The pin's version: field is the tag with this prefix stripped.
            tag_prefix: cachyos-
            asset_suffix: -arm64.tar.xz
            parse: the CachyOS version-file parse in assemble-rootfs.sh (cachyos-VER-DATE-slr)
          - pkg: proton-ge
            repo: GloriousEggroll/proton-ge-custom
            tag_prefix: ""
            asset_suffix: -aarch64.tar.gz
            parse: the GE version-file parse in assemble-rootfs.sh (GE-ProtonMAJOR-MINOR)
    steps:
      - uses: actions/checkout@v4
      - name: Compare upstream releases against the pin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
        run: |
          set -euo pipefail
          pin="packages/${{ matrix.pkg }}/prebuilt.pin"
          pinned="$(sed -n 's/^version:[[:space:]]*//p' "$pin" | head -1)"
          [ -n "$pinned" ] || { echo "::error::$pin has no version: field"; exit 1; }
          expect="${{ matrix.tag_prefix }}$pinned"

          # THE ASSET FILTER IS THE POINT, not a nicety. Both projects publish releases that carry
          # no arm64/aarch64 build at all (GE-Proton11-2 shipped x86_64 only), and taking the newest
          # TAG would report a version we cannot pin. So walk releases newest-first and take the
          # first one that actually ships the asset we install.
          #
          # GH_REPO points at THIS repo so `gh issue create` files here; `gh api repos/<upstream>`
          # names its target explicitly and is unaffected.
          latest="$(gh api "repos/${{ matrix.repo }}/releases" \
              --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name as $t | .assets[] | "\($t)\t\(.name)"' \
            | grep -F -e "$ASSET_SUFFIX" | head -1 | cut -f1)"
          [ -n "$latest" ] || { echo "::error::no ${{ matrix.repo }} release ships a $ASSET_SUFFIX asset"; exit 1; }

          echo "pinned=$expect latest=$latest"
          if [ "$latest" = "$expect" ]; then
            echo "pin is current"
            exit 0
          fi

          # Compared for INEQUALITY, not for "newer": these tags carry no orderable version (CachyOS
          # publishes off multiple lines — cachyos-10.0-sunset-slr landed AFTER an 11.0 release — and
          # GE's MAJOR-MINOR does not sort as text past minor 9). So this reports "upstream's newest
          # differs from ours" and a human decides. A release we deliberately skip is answered by
          # closing its issue once; the title dedupe keeps it closed.
          title="upstream: ${{ matrix.pkg }} $latest published (pinned: $expect)"
          if [ "$(gh issue list --state all --search "in:title \"$title\"" --json number --jq length)" -gt 0 ]; then
            echo "issue already filed for $latest"; exit 0
          fi
          gh issue create --title "$title" --assignee "$ASSIGNEE" \
            --label P2 --label area/steam --body "$(cat <<EOF
          Upstream published **$latest**; we pin **$expect**.
          Release: https://github.com/${{ matrix.repo }}/releases/tag/$latest

          Both baked Protons are self-contained (arm64 Wine + Valve WoW64 FEX), so a bump touches
          the pin, the lock row, and nothing else in the build. Drill:

          - [ ] \`$pin\`: version + url + sha256 together. Upstream publishes a **sha512** sidecar only — verify the download against THAT, then record the sha256 of the same bytes
          - [ ] leave \`dest\` alone. The directory is version-free on purpose, and assemble-rootfs.sh rewrites the tool's INTERNAL name (what Steam actually pins a game to) to a stable id — changing either unpins every game
          - [ ] re-verify ${{ matrix.parse }} still matches the shipped \`version\` file, and that compatibilitytool.vdf still has a compat_tools internal name + display_name and toolmanifest.vdf still declares require_tool_appid (rewrite_proton_tool asserts all four and fails the build loudly)
          - [ ] \`images/manifest.lock\`: the prebuilt row is generated straight from the pin's name/version/sha256 — update that row (a full \`make relock\` re-resolves the whole snapshot and is not what this needs)
          - [ ] HW pass: launch an x86 Windows title forced onto THIS tool and confirm Steam kept the per-game selection across the bump

          Read the release notes before taking it — a hotfix-only release may be worth jumping to, a Wine-base rebase is worth a real gameplay pass.
          EOF
          )"

  mesa:
    name: mesa release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare the mesa archive index against the PKGBUILD
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # packages/mesa/source.pin carries no version — the tarball is named in the PKGBUILD, and
          # THAT is the single source of truth a bump edits (source.pin's url/sha lines are the
          # informational copy). So the baseline is pkgver.
          pinned="$(sed -n 's/^pkgver=//p' packages/mesa/PKGBUILD | head -1)"
          [ -n "$pinned" ] || { echo "::error::packages/mesa/PKGBUILD has no pkgver= line"; exit 1; }

          # Three numeric components only: the archive lists -rcN candidates next to releases and we
          # must never pin one. sort -V then orders 26.10.0 after 26.9.0, which text sort would not.
          latest="$(curl -fsSL --retry 3 https://archive.mesa3d.org/ \
            | grep -oE 'mesa-[0-9]+\.[0-9]+\.[0-9]+\.tar\.xz' \
            | sed -E 's/^mesa-(.*)\.tar\.xz$/\1/' | sort -uV | tail -1)"
          [ -n "$latest" ] || { echo "::error::no release tarballs found in the archive.mesa3d.org index"; exit 1; }

          echo "pinned=$pinned latest=$latest"
          # Newer, not merely different: if we ever pin ahead of the index this must stay quiet.
          newer="$(printf '%s\n%s\n' "$pinned" "$latest" | sort -V | tail -1)"
          if [ "$latest" = "$pinned" ] || [ "$newer" != "$latest" ]; then
            echo "pin is current"
            exit 0
          fi

          title="upstream: mesa $latest released (pinned: $pinned)"
          if [ "$(gh issue list --state all --search "in:title \"$title\"" --json number --jq length)" -gt 0 ]; then
            echo "issue already filed for $latest"; exit 0
          fi
          gh issue create --title "$title" --assignee "$ASSIGNEE" \
            --label P2 --label area/mesa --body "$(cat <<EOF
          Upstream released **mesa $latest**; we build **$pinned**.
          Tarball: https://archive.mesa3d.org/mesa-$latest.tar.xz (\`.sha256sum\` sidecar alongside it)

          This bump moves BOTH Turnips. packages/mesa-x86 reads the tarball url/sha256 out of
          packages/mesa/PKGBUILD and the patch list out of packages/mesa/source.pin, so the guest
          (x86) driver rebuilds from whatever the host driver pins — they cannot drift, and they
          cannot be bumped apart either. Drill:

          - [ ] \`packages/mesa/PKGBUILD\`: pkgver + the tarball sha256sums entry together
          - [ ] \`packages/mesa/source.pin\`: the informational url/sha256 comment lines
          - [ ] re-roll every patch under \`packages/mesa/patches/\` against the new tag — they are applied \`patch -p1\` with no fuzz budget, so a rebase failure is a build failure
          - [ ] \`images/manifest.lock\`: mesa emits SEVERAL packages and every row it owns carries the pkgbase input hash — regenerate rather than editing one row, and let packages/verify-lock-rows.sh (in \`make test\`) confirm no sibling row kept the old hash
          - [ ] guest side: confirm the mesa-x86 build still passes its glibc symbol-ceiling gate against the pinned container (build.sh asserts it) — a mesa that needs a newer glibc than the FEX guest rootfs ships fails HERE, not on device
          - [ ] HW pass on BOTH consumers: a native arm64 Vulkan title (host Turnip) and a native x86 title under system FEX (guest Turnip). For the x86 leg, read the maps for libvulkan_freedreno — the failure mode is a SILENT GL fallback, so "the game runs" proves nothing
          EOF
          )"
