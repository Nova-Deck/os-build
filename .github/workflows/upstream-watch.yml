# Daily upstream watchers. NO job bumps anything — each detects that an upstream we track moved
# and opens ONE issue assigned to the maintainer to run the manual revalidation drill.
# Every job is deliberately stateless: it takes its baseline FROM REPO STATE (the pin / the
# PKGBUILD), so there is no side channel to keep in step and a bump silences its own watcher.
# Every job FAILS when its upstream parse yields nothing: a watcher that cannot see must go red,
# not stay quietly green.
#
# Issue titles are the dedupe key everywhere (searched across open AND closed), so a watcher that
# reports a version we decide NOT to take is answered by closing its issue once.
#
# Valve's FEX compat tool (app 3127680) is deliberately NOT watched. Anonymous appinfo hides the
# public-branch buildid, so the only visible signal is the PICS change number, which bumps on
# store-metadata edits too — it filed a near-daily issue that was closed unread every time. There
# is no watch worth having here until a build-level signal is reachable; check
# https://steamdb.info/app/3127680/history/ by hand when the tool's behavior is in question.
name: upstream-watch

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  issues: write
  contents: read

env:
  ASSIGNEE: loki666

jobs:
  kernel:
    name: linux release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare kernel.org releases against the pin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Baseline is kernel/SOURCE.pin's version:, read with the same parse kernel/build.sh
          # uses, so the watcher and the build can never disagree about what we ship.
          pinned="$(sed -n 's/^version:[[:space:]]*//p' kernel/SOURCE.pin | head -1)"
          [ -n "$pinned" ] || { echo "::error::kernel/SOURCE.pin has no version: field"; exit 1; }
          # First two components: 7.2 and 7.2.4 are both in series 7.2.
          series="$(printf '%s' "$pinned" | cut -d. -f1,2)"

          json="$(curl -fsSL --retry 3 https://www.kernel.org/releases.json)"
          # Real release lines only. linux-next is a daily snapshot we would never pin, and an EOL
          # line is a dead end. Anything carrying a dash is an -rc: mainline sits at 7.3-rcN for
          # weeks before 7.3 exists, and reporting one would be reporting a tarball we cannot ship.
          versions="$(printf '%s' "$json" | jq -r '.releases[]
              | select(.iseol == false)
              | select(.moniker == "mainline" or .moniker == "stable" or .moniker == "longterm")
              | .version' | grep -v -- '-' || true)"
          [ -n "$versions" ] || { echo "::error::no shippable release lines in releases.json"; exit 1; }

          # Titles carry ONLY the upstream version, never the pinned one. The dedupe key has to
          # survive our own re-pins: taking 7.2.1 while 7.2.4 is out leaves us behind, and a title
          # with "(pinned: ...)" in it would re-file the 7.2.4 issue we already closed.
          file_issue() {
            local title="$1" body="$2"
            if [ "$(gh issue list --state all --search "in:title \"$title\"" --json number --jq length)" -gt 0 ]; then
              echo "issue already filed: $title"; return 0
            fi
            gh issue create --title "$title" --assignee "$ASSIGNEE" \
              --label P2 --label area/kernel --body "$body"
          }
          src() { printf '%s' "$json" | jq -r --arg v "$1" '.releases[] | select(.version == $v) | .source'; }

          # --- the point release in the series we already ship ---
          esc="$(printf '%s' "$series" | sed 's/\./\\./g')"
          latest="$(printf '%s\n' "$versions" | grep -E "^${esc}\.[0-9]+$" | sort -V | tail -1 || true)"
          # sort -V, not text: 7.2.10 is newer than 7.2.9. Quiet when we already pin the newest,
          # and quiet if we ever pin ahead of the index.
          newest="$(printf '%s\n%s\n' "$pinned" "${latest:-$pinned}" | sort -V | tail -1)"
          if [ -n "$latest" ] && [ "$latest" != "$pinned" ] && [ "$newest" = "$latest" ]; then
            file_issue "upstream: linux $latest released" "$(cat <<EOF
          Upstream released **linux $latest**; we pin **$pinned**. Same series, so this is the
          cheap bump: no patch rebase is expected, and the risk is that it quietly is not.
          Tarball: $(src "$latest")
          Changelog: https://cdn.kernel.org/pub/linux/kernel/v${series%%.*}.x/ChangeLog-$latest

          - [ ] \`kernel/SOURCE.pin\`: version + url + sha256 together. Take the sha256 from kernel.org's **signed** \`sha256sums.asc\` for the series — hashing whatever the CDN served proves only that the CDN is self-consistent
          - [ ] \`git_tag\` + \`git_commit\`: the **dereferenced** tag (\`git ls-remote ... 'v$latest^{}'\`), not the annotated tag object
          - [ ] re-apply \`kernel/patches/\` **cumulatively, in lexical order, to one tree** — the way build.sh does. Dry-running each patch against a pristine tree reports false failures, because several of them patch files an earlier patch creates
          - [ ] fuzz budget: build.sh passes no \`-F0\`, so patch accepts fuzz=2 silently. A hunk that starts fuzzing is a hunk to read, not to wave through
          - [ ] config: every \`CONFIG_*\` named in \`kernel.config\` + \`trim-platforms.config\` must still exist in the patched tree, then merge for real in \`build/Dockerfile\` and assert each requested symbol kept its requested value
          - [ ] HW pass before this becomes the shipped kernel

          Closing this issue is a legitimate answer — a point release we decide to skip stays
          skipped, and the title dedupe will not re-file it.
          EOF
          )"
          fi

          # --- a whole new series ---
          # Series-level compare, so this fires ONCE when 7.3 lands and stays quiet while its own
          # point releases roll past under the stable moniker.
          upstream_series="$(printf '%s\n' "$versions" | cut -d. -f1,2 | sort -uV | tail -1)"
          top="$(printf '%s\n%s\n' "$series" "$upstream_series" | sort -V | tail -1)"
          if [ "$upstream_series" != "$series" ] && [ "$top" = "$upstream_series" ]; then
            head_version="$(printf '%s\n' "$versions" | grep -E "^$(printf '%s' "$upstream_series" | sed 's/\./\\./g')(\.[0-9]+)?$" | sort -V | head -1)"
            file_issue "upstream: linux $upstream_series opened" "$(cat <<EOF
          Upstream opened the **linux $upstream_series** series; we pin **$pinned**. This is the
          expensive bump — treat it as a project, not a pin edit.
          Tarball: $(src "$head_version")
          Diff: https://git.kernel.org/torvalds/ds/v$upstream_series/v$series

          Everything in the point-release drill applies, plus the two things that only a series
          bump can do to us:

          - [ ] **find the patches upstream took**, and delete them rather than carry them. Read *how* it took them: 7.2 landed our sm8550 bandwidth patch verbatim, but rewrote the sgm3804 panel-power driver with an **incompatible DT binding**, which forced a migration across all six board nodes and every panel driver that consumes them
          - [ ] **read what upstream deleted.** A \`CONFIG_*\` symbol removed upstream is silently ignored by kconfig, so a stale name in our fragments is invisible until the driver is missing on hardware
          - [ ] budget a full display/panel HW gate on the affected boards. The failure mode of a bad panel-power migration is a lit backlight over a black panel — it does not look like a kernel problem
          - [ ] record the outcome in \`kernel/SOURCE.pin\`'s header, including what was taken over and what it cost. That header is how the next bump knows what to re-check

          There is no deadline here: a series we choose not to take is answered by closing this
          issue once.
          EOF
          )"
          fi

  fex-rootfs:
    name: FEX guest RootFS update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare upstream index against the pin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pinned="$(sed -n 's/^version:[[:space:]]*//p' packages/fex-rootfs/prebuilt.pin | head -1)"
          [ -n "$pinned" ] || { echo "::error::prebuilt.pin has no version: field"; exit 1; }

          # Schema-agnostic on purpose: pull every ArchLinux/<date>/ArchLinux.ero mention out of
          # the index and take the newest date. A schema change that hides them goes red here.
          latest="$(curl -fsSL --retry 3 https://rootfs.fex-emu.gg/RootFS_links.json \
            | grep -oE 'ArchLinux/[0-9]{4}-[0-9]{2}-[0-9]{2}/ArchLinux\.ero' \
            | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | sort -u | tail -1 || true)"
          # `|| true` so the guard below reports rather than `set -e` killing the step silently at
          # the assignment when a grep matches nothing (see the kernel job's filter pipeline). A
          # schema change that hides the .ero entries is the whole point of the schema-agnostic
          # parse above, so it must go red WITH a reason, not just red.
          [ -n "$latest" ] || { echo "::error::no ArchLinux.ero entries found in RootFS_links.json"; exit 1; }

          echo "pinned=$pinned latest=$latest"
          if [ "$latest" \> "$pinned" ]; then
            title="upstream: FEX guest RootFS $latest published (pinned: $pinned)"
            if [ "$(gh issue list --state all --search "in:title \"$title\"" --json number --jq length)" -gt 0 ]; then
              echo "issue already filed for $latest"; exit 0
            fi
            gh issue create --title "$title" --assignee "$ASSIGNEE" \
              --label P2 --label area/steam --body "$(cat <<EOF
          Upstream published a newer FEX guest RootFS: **$latest** (we pin **$pinned**).
          Index: https://rootfs.fex-emu.gg/RootFS_links.json

          Bump drill (see the fex-guest-rootfs-bump notes — a bump drags more than the pin):
          - [ ] \`packages/fex-rootfs/prebuilt.pin\`: version + url + sha256 together; verify the download against upstream's XXH3 first
          - [ ] \`packages/fex-emu\` sysroot pins (guest thunks compile against the guest's packages) + overlay rebuild
          - [ ] \`packages/mesa-x86/builder.pin\`: snapshot must match the new guest date (build.sh asserts it)
          - [ ] verify by extracting the .ero, not by boot: locales (C.utf8-only?), ICD library_path shape, manifest presence
          - [ ] revalidate the mesa-x86 relative-ICD workaround: check a compat-tool title's maps for libvulkan_freedreno — the failure mode is a SILENT GL fallback, "the game runs" proves nothing
          - [ ] HW pass on the two canonical native x86 titles (Super Meat Boy, Parking Garage Rally Circuit)
          EOF
          )"
          else
            echo "pin is current"
          fi

  proton:
    name: Proton compat tool release (${{ matrix.pkg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkg: proton-cachyos
            repo: CachyOS/proton-cachyos
            # The pin's version: field is the tag with this prefix stripped.
            tag_prefix: cachyos-
            asset_suffix: -arm64.tar.xz
            parse: the CachyOS version-file parse in assemble-rootfs.sh (cachyos-VER-DATE-slr)
          - pkg: proton-ge
            repo: GloriousEggroll/proton-ge-custom
            tag_prefix: ""
            asset_suffix: -aarch64.tar.gz
            parse: the GE version-file parse in assemble-rootfs.sh (GE-ProtonMAJOR-MINOR)
    steps:
      - uses: actions/checkout@v4
      - name: Compare upstream releases against the pin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
        run: |
          set -euo pipefail
          pin="packages/${{ matrix.pkg }}/prebuilt.pin"
          pinned="$(sed -n 's/^version:[[:space:]]*//p' "$pin" | head -1)"
          [ -n "$pinned" ] || { echo "::error::$pin has no version: field"; exit 1; }
          expect="${{ matrix.tag_prefix }}$pinned"

          # THE ASSET FILTER IS THE POINT, not a nicety. Both projects publish releases that carry
          # no arm64/aarch64 build at all (GE-Proton11-2 shipped x86_64 only), and taking the newest
          # TAG would report a version we cannot pin. So walk releases newest-first and take the
          # first one that actually ships the asset we install.
          #
          # GH_REPO points at THIS repo so `gh issue create` files here; `gh api repos/<upstream>`
          # names its target explicitly and is unaffected.
          # The API call is CAPTURED FIRST rather than piped straight into the filter, and that is
          # load-bearing twice over.
          #
          # 1. SIGPIPE. The filter stops at the first match, which closes the pipe under whatever is
          #    still writing upstream. With `gh api` on the far end of that pipe it takes SIGPIPE and
          #    exits 141, and `set -o pipefail` then fails the substitution — so the job could go RED
          #    on a completely successful run, and the more releases upstream published the likelier
          #    it got. Splitting the two means nothing closes a pipe `gh` is still writing to.
          # 2. Honest errors. Folding both steps into one pipeline makes a network or auth failure
          #    indistinguishable from "upstream shipped no arm64 asset" — the guard would report the
          #    second while the truth was the first. Two stages, two messages.
          releases="$(gh api "repos/${{ matrix.repo }}/releases" \
              --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name as $t | .assets[] | "\($t)\t\(.name)"')"
          [ -n "$releases" ] || { echo "::error::gh api returned no releases for ${{ matrix.repo }}"; exit 1; }

          # -m1 rather than `| head -1`: grep stops itself after the first match and exits 0, so no
          # downstream process closes a pipe early. `|| true` keeps the guard below as the reporter
          # instead of `set -e` killing the step silently when nothing matches.
          latest="$(printf '%s\n' "$releases" | grep -F -m1 -e "$ASSET_SUFFIX" | cut -f1 || true)"
          [ -n "$latest" ] || { echo "::error::no ${{ matrix.repo }} release ships a $ASSET_SUFFIX asset"; exit 1; }

          echo "pinned=$expect latest=$latest"
          if [ "$latest" = "$expect" ]; then
            echo "pin is current"
            exit 0
          fi

          # Compared for INEQUALITY, not for "newer": these tags carry no orderable version (CachyOS
          # publishes off multiple lines — cachyos-10.0-sunset-slr landed AFTER an 11.0 release — and
          # GE's MAJOR-MINOR does not sort as text past minor 9). So this reports "upstream's newest
          # differs from ours" and a human decides. A release we deliberately skip is answered by
          # closing its issue once; the title dedupe keeps it closed.
          title="upstream: ${{ matrix.pkg }} $latest published (pinned: $expect)"
          if [ "$(gh issue list --state all --search "in:title \"$title\"" --json number --jq length)" -gt 0 ]; then
            echo "issue already filed for $latest"; exit 0
          fi
          gh issue create --title "$title" --assignee "$ASSIGNEE" \
            --label P2 --label area/steam --body "$(cat <<EOF
          Upstream published **$latest**; we pin **$expect**.
          Release: https://github.com/${{ matrix.repo }}/releases/tag/$latest

          Both baked Protons are self-contained (arm64 Wine + Valve WoW64 FEX), so a bump touches
          the pin, the lock row, and nothing else in the build. Drill:

          - [ ] \`$pin\`: version + url + sha256 together. Upstream publishes a **sha512** sidecar only — verify the download against THAT, then record the sha256 of the same bytes
          - [ ] leave \`dest\` alone. The directory is version-free on purpose, and assemble-rootfs.sh rewrites the tool's INTERNAL name (what Steam actually pins a game to) to a stable id — changing either unpins every game
          - [ ] re-verify ${{ matrix.parse }} still matches the shipped \`version\` file, and that compatibilitytool.vdf still has a compat_tools internal name + display_name and toolmanifest.vdf still declares require_tool_appid (rewrite_proton_tool asserts all four and fails the build loudly)
          - [ ] \`rootfs/manifest.lock\`: the prebuilt row is generated straight from the pin's name/version/sha256 — update that row (a full \`make relock\` re-resolves the whole snapshot and is not what this needs)
          - [ ] HW pass: launch an x86 Windows title forced onto THIS tool and confirm Steam kept the per-game selection across the bump

          Read the release notes before taking it — a hotfix-only release may be worth jumping to, a Wine-base rebase is worth a real gameplay pass.
          EOF
          )"

  mesa:
    name: mesa release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare the mesa archive index against the PKGBUILD
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # packages/mesa/source.pin carries no version — the tarball is named in the PKGBUILD, and
          # THAT is the single source of truth a bump edits (source.pin's url/sha lines are the
          # informational copy). So the baseline is pkgver.
          pinned="$(sed -n 's/^pkgver=//p' packages/mesa/PKGBUILD | head -1)"
          [ -n "$pinned" ] || { echo "::error::packages/mesa/PKGBUILD has no pkgver= line"; exit 1; }

          # Three numeric components only: the archive lists -rcN candidates next to releases and we
          # must never pin one. sort -V then orders 26.10.0 after 26.9.0, which text sort would not.
          latest="$(curl -fsSL --retry 3 https://archive.mesa3d.org/ \
            | grep -oE 'mesa-[0-9]+\.[0-9]+\.[0-9]+\.tar\.xz' \
            | sed -E 's/^mesa-(.*)\.tar\.xz$/\1/' | sort -uV | tail -1 || true)"
          # The `|| true` is what lets the guard below do the reporting: under `set -o pipefail` a
          # grep that matches nothing fails the whole substitution, and `set -e` would then kill the
          # step SILENTLY at the assignment — red, as the header requires, but with no line saying
          # why, and with the guard reduced to dead code. Same reason the kernel job ends its filter
          # pipeline with `|| true`. An index reshaped so the tarball pattern stops matching is the
          # exact case this watcher exists to shout about, so it must not go out mute.
          [ -n "$latest" ] || { echo "::error::no release tarballs found in the archive.mesa3d.org index"; exit 1; }

          echo "pinned=$pinned latest=$latest"
          # Newer, not merely different: if we ever pin ahead of the index this must stay quiet.
          newer="$(printf '%s\n%s\n' "$pinned" "$latest" | sort -V | tail -1)"
          if [ "$latest" = "$pinned" ] || [ "$newer" != "$latest" ]; then
            echo "pin is current"
            exit 0
          fi

          title="upstream: mesa $latest released (pinned: $pinned)"
          if [ "$(gh issue list --state all --search "in:title \"$title\"" --json number --jq length)" -gt 0 ]; then
            echo "issue already filed for $latest"; exit 0
          fi
          gh issue create --title "$title" --assignee "$ASSIGNEE" \
            --label P2 --label area/mesa --body "$(cat <<EOF
          Upstream released **mesa $latest**; we build **$pinned**.
          Tarball: https://archive.mesa3d.org/mesa-$latest.tar.xz

          Integrity: mesa publishes NO \`.sha256sum\` sidecar — that URL 404s, and this template
          claimed otherwise until 2026-08-22. The only upstream artifact is the detached \`.sig\`.
          Compute the sha256 locally from a tarball whose \`.sig\` verifies, and check the signer
          against the key that signed the release we currently ship — the fingerprint is recorded in
          the \`sha256sums\` provenance comment in \`packages/mesa/PKGBUILD\`. A GOOD signature from an
          unknown-trust key only proves the tarball matches whatever key came with it; continuity
          with the last release we validated on hardware is the load-bearing step.

          This bump moves BOTH Turnips. packages/mesa-x86 reads the tarball url/sha256 out of
          packages/mesa/PKGBUILD and the patch list out of packages/mesa/source.pin, so the guest
          (x86) driver rebuilds from whatever the host driver pins — they cannot drift, and they
          cannot be bumped apart either. Drill:

          - [ ] verify the tarball's detached \`.sig\` and confirm the signer is the SAME key as the currently pinned release's, BEFORE recording any sha256 (see Integrity above)
          - [ ] \`packages/mesa/PKGBUILD\`: pkgver + the tarball sha256sums entry together
          - [ ] \`packages/mesa/source.pin\`: the informational url/sha256 comment lines
          - [ ] re-roll every patch under \`packages/mesa/patches/\` against the new tag — they are applied \`patch -p1\` with no fuzz budget, so a rebase failure is a build failure
          - [ ] \`rootfs/manifest.lock\`: mesa emits SEVERAL packages and every row it owns carries the pkgbase input hash — regenerate rather than editing one row, and let packages/verify-lock-rows.sh (in \`make test\`) confirm no sibling row kept the old hash
          - [ ] guest side: confirm the mesa-x86 build still passes its glibc symbol-ceiling gate against the pinned container (build.sh asserts it) — a mesa that needs a newer glibc than the FEX guest rootfs ships fails HERE, not on device
          - [ ] HW pass on BOTH consumers: a native arm64 Vulkan title (host Turnip) and a native x86 title under system FEX (guest Turnip). For the x86 leg, read the maps for libvulkan_freedreno — the failure mode is a SILENT GL fallback, so "the game runs" proves nothing
          EOF
          )"

  scx:
    name: scx-scheds release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare upstream releases against the PKGBUILD
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Baseline is pkgver, like mesa: packages/scx-scheds/source.pin carries no version field,
          # and the PKGBUILD is what a bump actually edits. GH_REPO points at THIS repo so
          # `gh issue create` files here; `gh api repos/sched-ext/scx` names its target explicitly.
          pinned="$(sed -n 's/^pkgver=//p' packages/scx-scheds/PKGBUILD | head -1)"
          [ -n "$pinned" ] || { echo "::error::packages/scx-scheds/PKGBUILD has no pkgver= line"; exit 1; }

          # Three numeric components only. Upstream tags every third-party scheduler drop into the
          # same release stream (scx_cake 1.2.0, scx_mlfq 1.0.0 rode in on v1.1.3), so anchor the
          # pattern to a v-prefixed release tag and let sort -V order 1.1.10 after 1.1.9.
          latest="$(gh api repos/sched-ext/scx/releases --paginate \
              --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
            | grep -oE '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -uV | tail -1 || true)"
          # The `|| true` is what lets the guard below do the reporting: under `set -o pipefail` a
          # grep that matches nothing fails the whole substitution, and `set -e` would then kill the
          # step SILENTLY at the assignment — red, as the header requires, but with no line saying
          # why. Same reason the kernel job ends its filter pipeline with `|| true`.
          [ -n "$latest" ] || { echo "::error::no vX.Y.Z releases found for sched-ext/scx"; exit 1; }

          echo "pinned=$pinned latest=$latest"
          # Newer, not merely different: if we ever pin ahead of the release list this stays quiet.
          newer="$(printf '%s\n%s\n' "$pinned" "$latest" | sort -V | tail -1)"
          if [ "$latest" = "$pinned" ] || [ "$newer" != "$latest" ]; then
            echo "pin is current"
            exit 0
          fi

          title="upstream: scx-scheds $latest released (pinned: $pinned)"
          if [ "$(gh issue list --state all --search "in:title \"$title\"" --json number --jq length)" -gt 0 ]; then
            echo "issue already filed for $latest"; exit 0
          fi
          gh issue create --title "$title" --assignee "$ASSIGNEE" \
            --label P2 --label area/power --body "$(cat <<EOF
          Upstream released **scx $latest**; we build **$pinned**.
          Release: https://github.com/sched-ext/scx/releases/tag/v$latest

          scx_lavd is opt-in (the default CPU scheduler is \`none\`, the stock in-kernel EEVDF), so a
          regression here is INVISIBLE to anyone who never turns it on. That cuts both ways: it is a
          low-risk bump to take, and a bad one can sit unnoticed. Drill:

          - [ ] \`packages/scx-scheds/PKGBUILD\`: pkgver + sha256sums together. \`prepare()\` re-asserts that hash itself, because build-overlay.sh runs makepkg with \`--skipinteg\` and the sha256sums array is otherwise never checked
          - [ ] \`services/scx.service\` and \`services/scx\` still exist at those paths (\`package()\` installs both), and \`services/scx\` still carries the three lines package()'s sed rewrites: \`SCX_SCHEDULER=\`, the \`# Set custom flags\` comment, \`#SCX_FLAGS=\`. The \`SCX_FLAGS='--autopower'\` grep assertion is what fails the build if upstream reshapes that file
          - [ ] re-read the tarball's own \`kernel.config\` against \`kernel/kernel.config\` — it is upstream's authoritative CONFIG_* list and it does change between releases. Before adding a symbol, check whether it is promptless and already resolves \`=y\` from defconfig
          - [ ] read the release notes for scx_lavd changes GATED ON KERNEL VERSION. 1.1.3 dropped ops.cpu_acquire/release for \`tp_btf/sched_switch\` on kernels >= 6.19; a kernel-gated attach can need a CONFIG the upstream kernel.config lists but our fragment never named, and upstream's file does not have to change for our exposure to
          - [ ] \`rust/scx_cargo/src/bpf_builder.rs\` still calls \`.rustfmt("disable_rustfmt")\`. The qemu shim in \`build()\` exists ONLY to answer that sentinel — if upstream renames it the shim stops matching, which must fail loudly rather than silently reformat
          - [ ] \`scheds/rust/scx_{lavd,bpfland,rusty}\` still exist and \`Cargo.lock\` is still checked in (build() runs \`--frozen\`)
          - [ ] \`make overlay\` then \`make relock\`; read the \`rootfs/manifest.lock\` diff rather than refreshing it blind
          - [ ] HW pass with the scheduler actually SELECTED (\`novadeck-scheduler lavd\`) and a real gameplay leg — the shipped flags are \`--autopower\`, so also confirm lavd still follows the active power profile off novadeck-powerd's PowerProfiles name
          EOF
          )"
