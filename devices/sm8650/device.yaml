# novadeck device manifest — SM8650 (lead bring-up target)
soc: sm8650
soc_name: "Qualcomm Snapdragon 8 Gen 3"
gpu:
  model: "Adreno 750"
  kernel_driver: msm        # DRM/MSM in-kernel
  vulkan: turnip            # Mesa userspace (ships in upstream base)
kernel:
  page_size: 4k             # REQUIRED for FEX-Emu (Phase 3)
  config_fragment: kernel/sm8650/sm8650.config
  patches: kernel/sm8650/patches/  # applied in lexical order by kernel/build.sh
  dts_dir: kernel/sm8650/dts/qcom  # injected into arch/arm64/boot/dts/qcom at build
boards:                     # SM8650 handheld targets
  - name: "AYANEO Pocket S2"
    compatible: ayaneo,pocket-s2
    dts: kernel/sm8650/dts/qcom/sm8650-ayaneo-ps2.dts
    dtb: sm8650-ayaneo-ps2.dtb
  - name: "KONKR Pocket FIT"
    compatible: konkr,pocket-fit
    dts: kernel/sm8650/dts/qcom/sm8650-konkr-pf.dts
    dtb: sm8650-konkr-pf.dtb
boot:
  backend: android-bootimg  # default; edk2/UEFI is the Phase 5 alternative
  cmdline_file: devices/sm8650/cmdline
firmware:
  manifest: devices/sm8650/firmware-manifest.txt
status: phase-1-scaffold
