# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/composite_device_v1.json
# Schema version number
version: 1

# The type of configuration schema
kind: CompositeDevice

# Name of the composite device mapping
name: AYANEO Japanese Layout

# Only use this profile if *any* of the given matches matches. If this list is
# empty, then the source devices will *always* be checked.
# /sys/class/dmi/id/product_name
matches:
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: AYANEO Pocket ACE
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: AYANEO Pocket DMG

# Only allow a single source device per composite device of this type.
single_source: false

# One or more source devices to combine into a single virtual device. The events
# from these devices will be watched and translated according to the key map.
#
# THE CONTROLLER MCU HAS TWO MODES AND BOTH HAVE TO BE LISTED HERE. In Xbox mode it enumerates as
# `045e:028e` ("Microsoft X-Box 360 pad"); in AYANEO mode as `4001:0428` ("AYANEO Controller"). A
# UART frame to the MCU switches between them and that switch is not reliable, so which one a unit
# presents is not something we get to decide -- it is something InputPlumber has to discover. Both
# rows therefore carry the SAME capability map, because both modes emit the same raw codes.
#
# MEASURED 2026-08-22 on an AYANEO Pocket ACE that came up in AYANEO mode: the composite device
# matched only `event4` (the 1c4f:0002 MCU), the actual pad enumerated as 4001:0428 and NOTHING
# claimed it, so the face buttons never reached the capability map or the virtual Xbox pad. Nothing
# in the system noticed: Steam still worked, because Steam Input reads raw evdev with its own
# database, and the board simply presented two controllers instead of one. What does not survive it
# is anything that goes through SDL's game-controller layer -- there is no gamecontrollerdb entry
# for 4001:0428, so SDL does not consider it a controller at all, and the internal installer's
# consent screen (plan §4d) would find no pad to take consent on.
#
# Same shape as ROCKNIX/distribution#3177, which added this row upstream for the Pocket S Mini.
# Deliberately NOT added to the Xbox-layout config: no board of that layout has been observed in
# AYANEO mode, upstream did not add it either, and the map it would need is unverified.
source_devices:
  - group: gamepad
    evdev:
      vendor_id: "1c4f"
      product_id: "0002"
      handler: event*
    capability_map_id: sm8550_ayaneo_mcu_japanese
  - group: gamepad
    evdev:
      vendor_id: "045e"
      product_id: "028e"
      handler: event*
    capability_map_id: sm8550_ayaneo_mcu_japanese
  - group: gamepad
    evdev:
      vendor_id: "4001"
      product_id: "0428"
      handler: event*
    capability_map_id: sm8550_ayaneo_mcu_japanese

# Optional configuration for the composite device
options:
  # If true, InputPlumber will automatically try to manage the input device. If
  # this is false, InputPlumber will not try to manage the device unless an
  # external service enables management of the device. Defaults to 'false'
  auto_manage: true

# The target input device(s) to emulate by default
target_devices:
  - xbox-series
  - keyboard
