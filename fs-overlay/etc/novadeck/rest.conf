# novadeck-rest — rest-mode ("fake suspend") config. Single override point for /usr/bin/novadeck-rest.
# All keys are optional; the launcher applies the defaults shown below if unset.

# cpufreq governor applied to every policy on enter (restored to the per-policy previous governor on
# leave). Must be advertised in the policy's scaling_available_governors or that policy is left alone.
#NOVADECK_REST_GOVERNOR=powersave

# GPU devfreq governor applied on enter (restored to the previous one on leave). Must be advertised
# in the GPU's devfreq available_governors. The GPU node is found SoC-independently by its ".gpu"
# devfreq name suffix (gpu@<addr> -> "<addr>.gpu"), so no per-SoC address is hardcoded.
#NOVADECK_REST_GPU_GOVERNOR=powersave

# Which gamescope screen to blank: drm_sleep_<internal|external>_screen. The internal panel is the
# handheld display; "external" is for a docked monitor.
#NOVADECK_REST_SCREEN=internal

# Space-separated ops to skip (handy for bring-up / boards missing a knob): panel cpu rfkill governor gpugov.
# e.g. NOVADECK_REST_SKIP="panel" to test the power ops over SSH with no gamescope session running.
#NOVADECK_REST_SKIP=

# Where gamescope's wayland control socket lives (gamescopectl connects here). Defaults to the root
# session's /run/user/0 — matches novadeck-session's XDG_RUNTIME_DIR.
#XDG_RUNTIME_DIR=/run/user/0

# gamescope control-socket name. Normally LEAVE UNSET: the panel path auto-discovers the live socket
# from the running gamescope's /proc/<pid>/environ (gs_resolve_display), which is correct even when
# gamescope lands on gamescope-1+ after a stale socket. Set this only to force a specific socket.
#GAMESCOPE_WAYLAND_DISPLAY=gamescope-0

# --- power-key / suspend (novadeck-powerbuttond forwarder + novadeck-suspend engine) -----------------
# Power key: novadeck-powerbuttond forwards it to Steam (short -> steam://shortpowerpress,
# long -> steam://longpowerpress). Steam then calls a logind Suspend() that lands in novadeck-suspend.
#NOVADECK_WAKE_KEY=KEY_POWER
#NOVADECK_WAKE_DEBOUNCE=2          # seconds the forwarder ignores repeat presses after one fires

# Forwarder hold threshold (ms): hold >= this sends longpowerpress (Steam's power menu); a shorter tap
# sends shortpowerpress (sleep). 0 = always short.
#NOVADECK_WAKE_LONGPRESS_MS=1000

# cgroups frozen on suspend (space-separated). ONLY user.slice: the engine, journald, dbus and logind
# live in system.slice and must stay responsive to drive the wake.
#NOVADECK_SUSPEND_FREEZE_CGROUPS="/sys/fs/cgroup/user.slice"

# Wake debounce (ms): novadeck-suspend ignores a KEY_POWER within this of arming its grabbed wake wait
# (so the tail of the press that triggered the suspend does not immediately wake it).
#NOVADECK_WAKE_DEBOUNCE_MS=1000

# Power ops novadeck-suspend skips when it lowers power after the freeze (same shared primitives as
# novadeck-rest, same keys): cpu rfkill governor gpugov. Empty = apply all. Over SSH on a no-UART
# board, set "rfkill" to keep the link up while testing the freeze/thaw path (the freeze itself drops
# SSH since sshd is in the frozen set, but skipping rfkill avoids soft-blocking wlan on top).
#NOVADECK_SUSPEND_SKIP=
