# novadeck RAUC system configuration — Phase 5 (SteamDeck-style boot; docs/phase5.md).
#
# The boot chain is ABL -> steamcl (stage 1, shared ESP) -> per-slot GRUB (stage 2,
# efi-A/efi-B) -> kernel. The RAUC slots ARE the SteamOS images: `bootname=A|B` is literally the
# name of the image conf file on the ESP (/esp/SteamOS/conf/A.conf, B.conf), so there is no
# mapping layer between RAUC's idea of a slot and bootconf's.
#
# `bootloader=custom` hands the whole contract to /usr/bin/novadeck-bootctl, which is Valve's
# bootloader-custom-backend.sh.in nearly verbatim over /usr/bin/steamos-bootconf:
#
#   get-current  -> the image that is RUNNING (steamos-bootconf this-image)
#   get-primary  -> the image that will boot NEXT (selected-image)
#   set-primary  -> boot that image next: set-mode reboot (this is what STARTS a trial)
#   get-state    -> good|bad: bad iff boot-attempts >= 1 or image-invalid > 0
#   set-state    -> good: set-mode reboot --set image-invalid 0
#                   bad:  set-mode reboot-other --set image-invalid 1
#
# get-current is the one RAUC calls optional, and the one we cannot omit: its fallback is to read
# `root=` from /proc/cmdline, and ours is a STATIC novadeck-root-A that the initramfs resolves a
# slot for. Without it RAUC reports slot A as booted no matter what is running, and from slot B it
# picks the running root as the install target.
#
# The trial/revert semantics SteamOS expects are untouched: the boot service confirms with
# `steamos-bootconf set-mode booted`, a failed health check demotes with `set-state self bad`, and
# the stage-2 boot-attempts counter feeds get-state and stock steamcl's failsafe.

[system]
compatible=novadeck
bootloader=custom
# Must match `format=` in images/rauc/manifest.raucm.in, or every bundle is rejected.
bundle-formats=verity

# WITHOUT THIS LINE `adaptive=block-hash-index` IN THE MANIFEST DOES NOTHING. rauc's
# write_image_to_dev() checks for a data directory before it will consider an adaptive method and
# otherwise `goto raw_copy` -- and it says so at g_message level, not as an error
# (_reference/rauc/src/update_handler.c:1003-1006, "Ignoring adaptive method since 'data-directory'
# is not configured"). So the failure mode of deleting this is not a broken update, it is every OTA
# quietly going back to a full 3.9G download with nothing red anywhere. Measured 2026-08-04: with
# it, a consecutive release moves ~125M instead of 3.90G (see TODO.md for the method and numbers).
#
# WHY /home AND NOT /var. rauc requires a filesystem "not overwritten during updates", and /var is
# exactly that: /usr/lib/rauc/post-install.sh step 2 mkfs.ext4's the TARGET /var and rsyncs the
# running one over it on every install, so an index written there is per-slot state that gets
# stamped over. /home (p8, novadeck-home) is the only partition on the device that no update
# touches. It is deliberately NOT under the offload tree at /home/.novadeck/offload -- that tree is
# /var paths redirected onto /home, and this is the opposite: storage that must never be part of a
# slot. Sibling directory, same namespace.
#
# THE INDEX IS NOT A TRUST BOUNDARY, which is what makes a user-writable partition acceptable here.
# rauc re-hashes every block it takes from a local slot and compares it against the index inside
# the bundle, and that index is covered by the signature. A corrupted or tampered data directory
# can therefore only cause blocks to be re-fetched -- it cannot put unverified bytes in a slot. The
# directory is still created 0700 root (images/assemble-rootfs.sh), because "cannot be exploited"
# is not a reason to leave it writable.
#
# SIDE EFFECT, deliberate: setting this implies statusfile=<data-directory>/central.raucs. Until
# now our type=raw slots had nowhere to keep slot status at all ("Using per-slot statusfile. System
# status information not supported!" on every install), so this is new capability rather than a
# migration -- but novadeck-update's staged_identity() reads GetSlotStatus, so that path is
# load-bearing and covered by images/test-update.sh.
data-directory=/home/.novadeck/rauc

[keyring]
# Installed from the committed CA (images/rauc/novadeck-ca.pem) by images/assemble-rootfs.sh.
# images/guard-rootfs.sh asserts it is present in the built tree: a missing keyring does not
# fail loudly at install time, it just means nothing meaningful is being verified.
path=/etc/rauc/keyring.pem
# ci/gen-signing-ca.sh gives the release cert extendedKeyUsage=codeSigning, deliberately: that is
# what stops a leaked signing key being usable to terminate TLS. RAUC's DEFAULT verification
# purpose is smimesign, which accepts only emailProtection or no EKU at all -- so without this
# line the two ends disagree and EVERY bundle is rejected with "unsuitable certificate purpose".
# Changing this to match the cert, rather than widening the cert's EKU, keeps that restriction.
check-purpose=codesign

[handlers]
bootloader-custom-backend=/usr/bin/novadeck-bootctl
# Runs AFTER the new slot is written and unmounted. Randomises the target's btrfs fsid, migrates
# the per-slot /var identity, refreshes the slot's efi partition (stage-2 GRUB + partsets) and the
# shared ESP (steamcl), and re-arms the trial via the bootconf. Without it the freshly installed
# slot is not actually usable — see the script's own header.
post-install=/usr/lib/rauc/post-install.sh

# Raw slots: the bundle carries a whole btrfs image and RAUC writes it out verbatim. Do NOT change
# this to a filesystem type -- the image's fsid is rewritten by the post-install hook afterwards,
# which assumes it owns the bytes on the device.
[slot.rootfs.0]
device=/dev/disk/by-partlabel/novadeck-root-A
type=raw
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-partlabel/novadeck-root-B
type=raw
bootname=B
