# novadeck: bound what systemd-coredump is allowed to do to the card.
#
# core_pattern pipes every crash to systemd-coredump, and /var/lib/systemd/coredump is an OFFLOAD
# path — a bind mount from the shared /home tree, i.e. the same partition as the user's Steam
# library. So an unbounded dump does not just fill "some cache", it eats game storage on the one
# card that also carries root and /var.
#
# The process that makes this urgent is steamwebhelper. It sits at 300-500 MB healthy, but the
# SteamUI freeze drives a renderer to 1-2 GB routinely and has been seen at 11 GB. If Steam's
# watchdog SIGTRAPs one of those, the default config happily reads the whole address space and
# writes it out — multi-GB of read+write onto the card that the wedged UI is already stalled on.
# The dump is worthless too: libcef.so ships no usable symbols, so nothing can be resolved from it.
#
# ProcessSizeMax is the important one: it makes systemd-coredump bail BEFORE reading the core, so
# an oversized crash costs nothing rather than costing an I/O storm. ExternalSizeMax then caps what
# reaches disk. 768M is chosen to sit above anything we would actually want to debug (our daemons
# are tens of MB, gamescope a few hundred) and below a webhelper that has started to run away.
#
# MaxUse=1G bounds the directory as a whole. KeepFree is deliberately NOT set: its default is 15%
# of the filesystem, which scales with the card, and pinning it to a fixed number here would make
# the guarantee WEAKER on the large cards this most needs to protect. MaxUse is the binding limit.
[Coredump]
Storage=external
Compress=yes
ProcessSizeMax=768M
ExternalSizeMax=768M
MaxUse=1G
