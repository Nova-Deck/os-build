# rauc's data-directory lives on /home (see fs-overlay/etc/rauc/system.conf for why it cannot live
# on /var), and rauc is D-BUS ACTIVATED -- de.pengutronix.rauc.service starts rauc.service on the
# first method call, from whatever ordering context the caller happens to have. Nothing in the
# stock unit ties it to /home, so an early activation could read a data-directory that is not
# mounted yet.
#
# The failure that would cause is the quiet one this whole feature has to be defended against:
# rauc does not treat a missing data-directory as an error. It logs at g_message level and falls
# back to a full raw copy (_reference/rauc/src/update_handler.c:1003-1006). An update would still
# succeed -- it would just silently download 3.9G instead of ~125M, and nothing would go red.
#
# RequiresMountsFor pulls in and orders after home.mount, which is the whole fix. It is deliberately
# the DIRECTORY and not /home: if the path ever moves, this follows it.
[Unit]
RequiresMountsFor=/home/.novadeck/rauc
