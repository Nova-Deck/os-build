# Cap how long logind waits for a session scope to drain at poweroff.
#
# gamescope ignores SIGTERM during teardown (a never-signaling linux-drm-syncobj fence in its WSI
# handshake — see the WSI caveat in /usr/bin/novadeck-session), so every poweroff where gamescope is
# still healthy sits at the stock 90s DefaultTimeoutStopSec and is then SIGKILLed anyway:
#
#   session-1.scope: Stopping timed out. Killing.
#   session-1.scope: Killing process 807 (gamescope-wl) with signal SIGKILL
#
# Nothing is gained by that wait — gamescope never exits on its own, and by the time it fires it is
# the only process left in the scope. Shorten the wall so the SIGKILL that always ends this arrives
# promptly. Fixing it here rather than in novadeck-session is deliberate: an earlier attempt to
# escalate SIGTERM -> SIGKILL from the session script's cleanup trap did NOT work on HW, because SDDM
# tears the script down at the same moment (sddm-helper exits 1) and it never survives its own grace
# period. systemd owns the scope, so systemd is where the timeout belongs.
#
# 10s, not less: the scope also holds Steam and the running game, which do handle SIGTERM and want a
# moment to flush config and cloud saves. If HW ever shows Steam being SIGKILLed mid-write, raise
# this — do not lower it.
#
# Dash-truncated drop-in: applies to every transient session-N.scope logind creates, the same form
# used for user-.slice.d. Verify on device with:
#   systemctl show -p TimeoutStopUSec session-1.scope   # expect 10s, not 1min 30s
[Scope]
TimeoutStopSec=10s
