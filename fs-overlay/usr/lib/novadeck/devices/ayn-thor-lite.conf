NOVADECK_DEVICE_ID=ayn-thor-lite
NOVADECK_DEVICE_NAME='AYN Thor Lite'
NOVADECK_SOC_CLASS=SM8250

# The only SM8250 board with TWO live DSI links: the primary chipone,icna3520 on
# mdss_dsi0 (dsi_p_* pinctrl) and a secondary ch13726a,thor on mdss_dsi1. Every
# single-DSI board in this tree enumerates as DSI-1; the one other dual-DSI board,
# the SM8550 AYN Thor, has the same layout and its primary lands on DSI-2. Follow
# that — and re-check it on hardware, since it is the one field here that is read
# off DRM rather than derived from the DTS. Geometry below is the PRIMARY panel's.
NOVADECK_PRIMARY_CONNECTOR=DSI-2
NOVADECK_PANEL_NATIVE_WIDTH=1080
NOVADECK_PANEL_NATIVE_HEIGHT=1920
NOVADECK_PANEL_REFRESH_RATES=60,120
NOVADECK_GAMESCOPE_FAKE_OUTPUT_MM=177x100
