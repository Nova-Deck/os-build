NOVADECK_DEVICE_ID=retroid-pocket-mini-v2
NOVADECK_DEVICE_NAME='Retroid Pocket Mini V2'
NOVADECK_SOC_CLASS=SM8250

# 1080x1240 native -> 1240x1080 logical, an aspect no other board has. The fake mm
# keep the ~0.0926 mm/px every other profile uses (1920->177, 1080->100, 960->90),
# giving 1240 -> 115.
NOVADECK_PRIMARY_CONNECTOR=DSI-1
NOVADECK_PANEL_NATIVE_WIDTH=1080
NOVADECK_PANEL_NATIVE_HEIGHT=1240
NOVADECK_PANEL_REFRESH_RATES=60
NOVADECK_GAMESCOPE_FAKE_OUTPUT_MM=115x100
