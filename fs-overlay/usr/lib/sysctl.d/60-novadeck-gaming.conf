# Gaming/perf sysctl tuning (SteamOS/CachyOS parity). Overrides the base
# 10-arch.conf / 50-default.conf drop-ins (higher prefix wins).

# Disable kernel watchdogs: they add periodic overhead and are pointless on a
# fixed handheld target (no need to reboot on a soft lockup during a game).
kernel.nmi_watchdog=0
kernel.soft_watchdog=0
kernel.watchdog=0

# VM tuning. swappiness=180 is now LIVE: zram-generator brings up a zram0 swap
# device at ram/2 (fs-overlay/usr/lib/systemd/zram-generator.conf), so this is no
# longer forward-compat. The high value is correct specifically BECAUSE the swap is
# RAM-backed and compressed — it tells the kernel that swapping an anonymous page to
# zram is cheaper than dropping page cache, which for zram it genuinely is. It would
# be the wrong value for swap on the SD card. The watermark/dirty values smooth
# memory reclaim and writeback under game load.
vm.swappiness=180
vm.watermark_boost_factor=0
vm.watermark_scale_factor=125
vm.dirty_bytes=268435456
vm.dirty_background_bytes=67108864
vm.dirty_writeback_centisecs=1500
vm.page-cluster=0
# Many modern games / Proton (esync) exhaust the default mmap limit; raise it.
vm.max_map_count=2147483642

# inotify. The watch limit is the one everybody raises; the INSTANCE limit (how many inotify fds a
# single uid may hold) matters here too, because everything that watches lives under one uid: the
# Steam client and steamwebhelper, gamescope, pipewire/wireplumber, the session units, plus one per
# game process. The default 128 is per-uid, so the ceiling is shared across all of them and the
# failure mode is a late-starting watcher getting EMFILE — i.e. it silently stops noticing changes.
fs.inotify.max_user_watches=524288
fs.inotify.max_user_instances=1024
