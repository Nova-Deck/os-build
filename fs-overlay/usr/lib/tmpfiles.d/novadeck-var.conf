# novadeck — the /var hierarchy, declared in the ROOT rather than only baked into the var image.
#
# WHY: /var is a separate 256M partition per A/B slot, and it is populated at BUILD time —
# images/assemble-rootfs.sh carves it out of the staged tree into var-a.img / var-b.img. Nothing
# creates it on the device. Then fs-overlay/usr/lib/rauc/post-install.sh reformats the target slot's
# /var and copies the RUNNING /var over wholesale, which means an updated slot's /var is the
# PREVIOUS version's /var. A directory that version N+1 needs and version N never had therefore
# does not exist after the update, on the one path where the symptom shows up as a service failing
# on a device rather than as a build error.
#
# So the var hierarchy has to be expressible as something the NEW root asserts on every boot, and
# tmpfiles.d is that. On a freshly flashed card every line here is a no-op (the build already made
# the directory); after an update it is the repair. That is also the instruction for whoever adds
# the next /var path: put it HERE, not only in the build, or it will be missing on every device that
# arrives by update instead of by flash.
#
# ORDERING is already correct and worth knowing: the offload binds (novadeck-offload.target) are
# ordered Before=local-fs.target and systemd-tmpfiles-setup runs after it, so by the time these
# lines are applied /var/log and friends are already bind-mounted from /home. Which is why NONE of
# the offloaded paths are declared below — a mode/ownership line here would be reaching into the
# shared /home tree, not into this slot's /var. Offloaded today: /var/log, /var/tmp,
# /var/cache/pacman, /var/lib/flatpak, /var/lib/systemd/coredump.
#
# Paths other packages already declare are also left out deliberately, so there is exactly one
# owner per line: /var/cache and /var/run come from systemd's var.conf, /var/tmp from tmp.conf,
# /var/lock from legacy.conf, /var/empty from sshd.conf. Check with
# `systemd-analyze cat-config tmpfiles.d` before adding anything.

# The standard hierarchy the `filesystem` package creates at build time.
d /var/local      0755 root root -
d /var/opt        0755 root root -
d /var/lib/misc   0755 root root -
d /var/games      0775 root games -
d /var/spool/mail 1777 root root -
L /var/mail       -    -    -     - spool/mail

# novadeck's own per-slot state: `slot` (which var image actually got mounted — the independent
# witness the initramfs handoff is checked against), `mac-wifi` (the write-once derived Wi-Fi MAC)
# and `powerd.state`. gen-mac.sh and novadeck-powerd each `mkdir -p` it defensively, so this line
# is not what makes them work; it is what stops the directory's MODE from being whichever consumer
# happened to create it first, and it puts the path in a declaration next to the rest of /var.
d /var/lib/novadeck 0755 root root -
