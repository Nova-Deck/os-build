Syntax 4

# Retroid Pocket 5 / Flip2 / Mini / Mini V2 (SM8250).
#
# All four boards share one sound card — sm8250-retroidpocket-common.dtsi sets
# model = "RetroidPocket" — so they share one profile and four conf.d symlinks.
#
# wcd9385 (wcd938x) headphone/mic + two wsa881x speakers on SoundWire, driven
# through the legacy q6asm/ADM path (SND_SOC_SM8250), not AudioReach.

Comment "Retroid Pocket"

SectionUseCase."HiFi" {
	File "/Qualcomm/sm8250/RetroidPocket/HiFi.conf"
	Comment "Speakers, headphones and headset mic"
}

BootSequence [
	cset "name='WSA_RX0 Digital Volume' 120"
	cset "name='WSA_RX1 Digital Volume' 120"
	cset "name='SpkrLeft PA Volume' 12"
	cset "name='SpkrRight PA Volume' 12"
	cset "name='HPHL Volume' 20"
	cset "name='HPHR Volume' 20"
	cset "name='ADC2 Volume' 10"
]

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
Include.wcd-init.File "/codecs/wcd938x/init.conf"
Include.wsa-init.File "/codecs/wsa881x/init.conf"
Include.rxm-init.File "/codecs/qcom-lpass/rx-macro/init.conf"
