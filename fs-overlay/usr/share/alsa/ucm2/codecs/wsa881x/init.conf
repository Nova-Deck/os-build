# WSA881x volume-control remap.
#
# This file does NOT exist in alsa-ucm-conf (checked against 1.2.14, the version
# images/customize-base.sh installs): upstream ships codecs/wsa881x/ with only
# DefaultEnableSeq / SpeakerEnableSeq / SpeakerDisableSeq. Its sibling
# codecs/wsa884x/init.conf — which the SM8650 cards use — does exist upstream,
# which is why no SM8250 profile could just borrow it.
#
# Without this, the two wsa881x amps expose 'SpkrLeft PA Volume' and
# 'SpkrRight PA Volume' as separate mono controls, and there is no single
# stereo 'Speakers Volume' for PlaybackMixerElem "Speakers" to bind to — so
# volume changes from the session reach neither amp.
#
# Applies to the Retroid Pocket and MANGMI Pocket Max profiles. The AYN Thor
# Lite drives AW88166 amps over MI2S instead and does not include this.

LibraryConfig.remap.Config {

	ctl.default.map {
		# Merge the two mono controls into one stereo control.
		"name='Speakers Volume'" {
			"name='SpkrLeft PA Volume'".vindex.0 0
			"name='SpkrRight PA Volume'".vindex.1 0
		}
	}
}
