# novadeck: the power/suspend/lid keys are owned by Steam (the key is forwarded by
# novadeck-powerbuttond, and Steam drives sleep/power via a logind Suspend() that is intercepted into
# novadeck-suspend's fake-suspend). Tell logind to take NO direct action on them so it never powers
# off or kernel-suspends behind Steam's back. logind still SERVICES the Suspend() D-Bus call — that is
# the path we intercept — it just must not react to the raw key/lid events itself.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
