# novadeck: redirect EVERY logind-mediated Suspend() onto the userspace cgroup-freeze fake-suspend
# instead of kernel s2idle/s2ram, which is out of scope on these SoCs. The power key is forwarded to
# Steam (novadeck-powerbuttond), which calls Suspend() like the Steam power menu and idle timeouts do;
# they all reach systemd-sleep here and would otherwise write /sys/power/state. With this in place
# kernel suspend is unreachable through the normal stack regardless of which trigger fires.
[Service]
# Swap the kernel-suspend worker for novadeck's fake-suspend engine (empty ExecStart= first resets the
# stock list). `sleep` freezes user.slice, lowers power, then BLOCKS until the power key wakes it — so
# logind stays "in suspend" for the whole sleep, exactly as an in-kernel s2ram blocks, and emits its
# resume only on real thaw. No custom slice is needed: the engine freezes only user.slice, and it (like
# journald/dbus/logind) lives in system.slice, so it never freezes itself.
ExecStart=
ExecStart=/usr/bin/novadeck-suspend sleep
# The engine blocks for the entire sleep (potentially hours); do not let the oneshot start timeout kill
# it and desync logind's suspend state. A `systemctl stop` still force-wakes cleanly (engine trap).
TimeoutStartSec=infinity
