# novadeck: SNTP servers for systemd-timesyncd. The device has no RTC battery sync and nothing
# else steps the clock, so it boots near epoch (logs read 1970-…) until timesyncd reaches the
# network. Harmless for suspend timing (it uses deltas) but breaks TLS cert validity windows and
# makes journald timestamps useless. Enabled via 60-novadeck-timesyncd.preset in this overlay.
[Time]
NTP=pool.ntp.org
FallbackNTP=0.pool.ntp.org 1.pool.ntp.org 2.pool.ntp.org 3.pool.ntp.org
