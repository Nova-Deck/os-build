# novadeck bootstrap pacman configuration (Phase 4c).
#
# This is the config the BUILD uses to lay a root down from packages — never a file that
# ships. images/customize-base.sh stages it into the customization container and passes it
# as `pacman -r work/base --config …`, so it describes where the build fetches from, not
# what the device would later fetch from (nothing: the release root has no pacman at all,
# see images/seal.list).
#
# It exists as a committed artifact rather than as an in-container edit of the vendor's
# /etc/pacman.conf, which is what the pre-4c script did. Once the root's content comes from
# packages, the repo set those packages are resolved from is part of the declaration, and a
# declaration belongs in the tree where a diff can be reviewed.
#
# The mirrorlist is written by customize-base.sh from snapshot.pin, into the same staging
# directory this file is read from. It carries a literal `$repo/$arch` for pacman to expand,
# which is exactly why it is a separate file and not a Server line here.

[options]
Architecture = auto

# From-source overlay packages (packages/*/source.pin -> work/repo/<arch>/), built by
# packages/build-overlay.sh. FIRST, because `pacman -S` resolves from the first repo in
# ORDER that provides a name — version does not override order. That ordering only decides
# RESOLVE-mode builds (`make relock`); a locked build installs package FILES by path and
# cannot pick the wrong one either way.
#
# The overlay is REQUIRED, not optional: PKGS names packages that exist in no holo repo at
# all (gtk2, mangohud, sddm, fex-emu, scx-scheds). customize-base.sh refuses to start
# without it rather than letting a resolve fail deep inside an emulated container.
#
# TrustAll: our own build artifact from a repo we just built on this machine.
[novadeck]
SigLevel = Optional TrustAll
Server = file:///novarepo

# The pinned snapshot revision (snapshot.pin), served SigLevel = Optional with no detached
# signatures — so pacman's own signature check is a no-op here and the sha256 committed in
# images/manifest.lock is what actually pins these bytes (images/fetchlock.sh verifies every
# file before the container starts). Matches the SigLevel the vendor's own pacman.conf sets
# for these repos; raising it here would only fail a build over a signature nobody publishes.
[core]
SigLevel = Optional
Include = /prebuilt/mirrorlist

[extra]
SigLevel = Optional
Include = /prebuilt/mirrorlist
