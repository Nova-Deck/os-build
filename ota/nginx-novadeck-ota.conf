# novadeck OTA vhost — Phase 3. Installed at /etc/nginx/sites-available/novadeck-ota by
# ota/setup-server.sh, which is the only thing that should ever write it on the instance.
#
# WHY THIS TREE IS ota/ AND NOT images/ota/. images/ is uniformly things that build or publish an
# image artifact for the DEVICE. An nginx vhost and an apt-installing bootstrap for a rented Ubuntu
# box are neither: they configure a third-party host that merely serves what images/ produces. The
# peer is ci/ — infrastructure that is not the device and not an image.
#
# THE DOCROOT IS THE URL ROOT. fs-overlay/usr/bin/novadeck-update's DEFAULT_URL carries no path
# prefix, deliberately — the host is dedicated to updates — so a CHANNEL is the first path segment:
#
#   /srv/novadeck-ota/stable/latest.json  ->  https://updates.novadeck.cloud-ip.cc/stable/latest.json
#   /srv/novadeck-ota/stable/*.raucb      ->  https://updates.novadeck.cloud-ip.cc/stable/*.raucb
#
# Adding a `beta` channel is a directory, not a migration.
#
# CERTBOT DOES NOT OWN THIS FILE, and that is why setup-server.sh runs `certbot certonly --webroot`
# rather than `--nginx`. The --nginx installer EDITS the vhost it finds, in place: the ssl_* lines
# below would then be certbot's, this committed file would stop being what is running, and the drift
# would be invisible until someone diffed a live server against the repo. certonly writes only to
# /etc/letsencrypt and leaves this file alone, so the repo stays authoritative.
#
# THERE IS NO UPLOAD SURFACE HERE. Publishing goes over SSH (ota/publish-bundle.sh); nginx is
# read-only by construction, both in the filesystem permissions and in the limit_except below.

# Every other Host that resolves here. The instance has a public IP, so it is reachable by its
# address and by any name anyone points at it; without this, all of those get the OTA docroot and
# this becomes a file host for strangers. ssl_reject_handshake (nginx >= 1.19.4) refuses at the TLS
# layer, so the default server needs no certificate of its own.
server {
    listen      80  default_server;
    listen      [::]:80 default_server;
    server_name _;
    return      444;
}
server {
    listen      443 ssl default_server;
    listen      [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

# Port 80 for the real name: redirect, EXCEPT the ACME path. HTTP-01 validation happens over plain
# HTTP, so a blanket redirect here breaks every renewal — and a renewal that stops takes every
# device's update check offline ~60 days later, with no signal on the device beyond "unreachable".
server {
    listen      80;
    listen      [::]:80;
    server_name updates.novadeck.cloud-ip.cc;

    location /.well-known/acme-challenge/ {
        root /srv/novadeck-ota;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # HTTP/2 IS ON. This block used to say "the only client is curl fetching one large file with a
    # Range header; HTTP/2's multiplexing is for pages with many small subresources", and that was
    # never a description of this server: the bundle is fetched by RAUC, and the only thing curl
    # fetches is <channel>/latest.json, a few hundred bytes. rauc streams the bundle over NBD,
    # turning block reads into MANY concurrent Range requests, and it says what HTTP/1 costs it the
    # moment it starts —
    #
    #   rauc-nbd-WARNING: using HTTP/1 for streaming, expect slow installation
    #
    # observed on an AYANEO Pocket ACE during a real install from this server. HTTP/1 serialises
    # exactly the request pattern rauc depends on, and the payload is ~4 GB over a handheld's Wi-Fi.
    #
    # THE OLD-STYLE SPELLING, on purpose: `http2 on;` is nginx >= 1.25 and Ubuntu 24.04 ships 1.24,
    # where it is a hard "unknown directive" that takes the whole server down on reload. The `listen
    # ... http2` parameter is deprecated in 1.25+ but still works, so this spelling is the one that
    # is correct on the box we run and forward-compatible with the one we might.
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name updates.novadeck.cloud-ip.cc;

    root        /srv/novadeck-ota;
    autoindex   off;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/updates.novadeck.cloud-ip.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/updates.novadeck.cloud-ip.cc/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    # No ssl_stapling: Let's Encrypt stopped putting an OCSP responder URL in its certificates, so
    # nginx ignores the directive and warns about it on every single reload. A warning that is
    # always present is a warning nobody reads.

    # No includeSubDomains: nothing lives below this name, and asserting otherwise would be a claim
    # about hostnames we do not control. See docs/ota.md on why cloud-ip.cc is not ours.
    #
    # THESE ARE REPEATED IN EVERY location THAT SETS A HEADER OF ITS OWN, and that is not
    # redundancy. nginx's add_header does not accumulate across levels: a location with ANY
    # add_header discards every add_header inherited from the server block. Declaring them only
    # here would silently drop both from .raucb and latest.json — the two paths that actually
    # matter — while leaving them on the 404s nobody looks at.
    add_header Strict-Transport-Security "max-age=15768000" always;
    add_header X-Content-Type-Options    "nosniff"          always;

    # A positive signal that does not depend on the docroot having anything in it. `stable/` is
    # legitimately EMPTY between releases, so every other probe answers 404 and a dead server and a
    # quiet one look identical from outside. This is what tells them apart.
    #
    # default_type rather than `add_header Content-Type`, so this location adds no header at all and
    # keeps inheriting the two above.
    location = /healthz {
        default_type text/plain;
        return 200 "novadeck-ota ok\n";
    }

    # The bundles. Cacheable forever because the version is IN the filename — genbundle.sh names
    # them novadeck-<version>.raucb and publish-bundle.sh refuses anything else — so the bytes behind
    # a given URL never change.
    #
    # gzip is OFF here on purpose: a gzipped response cannot serve byte ranges, and `curl -C -`
    # resume is the only thing that makes a ~4G download over first-boot Wi-Fi survivable. The
    # payload is already-compressed squashfs anyway, so there is nothing to win and a resume to lose.
    location ~ \.raucb$ {
        default_type application/octet-stream;
        gzip         off;
        add_header   Cache-Control "public, max-age=31536000, immutable";
        add_header   Strict-Transport-Security "max-age=15768000" always;
        add_header   X-Content-Type-Options    "nosniff"          always;
    }

    # The pointer. Never cached: a stale latest.json is precisely the failure that makes a fresh
    # publish invisible to the fleet while the bytes sit there being served correctly.
    location ~ /latest\.json$ {
        default_type application/json;
        add_header   Cache-Control "no-store";
        add_header   Strict-Transport-Security "max-age=15768000" always;
        add_header   X-Content-Type-Options    "nosniff"          always;
    }

    location / {
        # Read-only by construction. Publishing is an SSH concern; nothing reaches the docroot
        # through nginx, so a bug in the config cannot become a write primitive.
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
    }
}
