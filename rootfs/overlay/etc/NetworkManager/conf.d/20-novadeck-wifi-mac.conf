# Use the radio's own permanent MAC, never a randomized or cloned one.
#
# The permanent address is stable and per-unit because stage 2 writes it into the devicetree
# (local-mac-address = 02:00:<SoC serial>, GRUB module novadeck_radiomac; ath12k reads it with
# kernel/patches 1020). Steam pins every network it saves to that address (`mac-address=`), so the
# address in use must be the same one, or a router sees one MAC while the profile names another.
#
# This replaced novadeck-macgen, which cloned a sha256(machine-id) address over a permanent MAC that
# changed every boot. If stage 2 ever fails to write the property, the firmware's random address
# comes back, and so does the "saved network asks for the password again" bug. GRUB prints that.
[device]
wifi.scan-rand-mac-address=no

[connection]
wifi.cloned-mac-address=permanent
ethernet.cloned-mac-address=permanent
