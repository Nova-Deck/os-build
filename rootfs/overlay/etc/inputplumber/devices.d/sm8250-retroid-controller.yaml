# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/composite_device_v1.json
# Schema version number
version: 1

# The type of configuration schema
kind: CompositeDevice

# Name of the composite device mapping
name: Retroid Layout

# Only use this profile if *any* of the given matches matches.
#
# The five boards below all drive the SAME MCU gamepad: the AYN Thor Lite uses
# retroid,retroid-pocket-gamepad too, not an AYN-specific part, so it belongs on
# this profile rather than with the SM8550 AYN boards.
#
# The list is explicit even though the source device's phys_path is already
# board-specific. novadeck ships ONE image for every SoC, so an empty `matches`
# (which means "always check the source devices") would leave this profile live
# on SM8550/SM8650 hardware as well.
matches:
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: Retroid Pocket 5
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: Retroid Pocket Flip2
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: Retroid Pocket Mini
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: Retroid Pocket Mini V2
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: AYN Thor Lite

# Only allow a single source device per composite device of this type.
single_source: false

# One or more source devices to combine into a single virtual device. The events
# from these devices will be watched and translated according to the key map.
source_devices:
  - group: gamepad
    evdev:
      phys_path: retroid-pocket-gamepad/input0
      handler: event*
    capability_map_id: sm8250_retroid_mcu

# Optional configuration for the composite device
options:
  # If true, InputPlumber will automatically try to manage the input device. If
  # this is false, InputPlumber will not try to manage the device unless an
  # external service enables management of the device. Defaults to 'false'
  auto_manage: true

# The target input device(s) to emulate by default. xbox-series, not the ds5 the
# source config used: every other novadeck board emulates an Xbox pad, and Steam
# picks its glyph set and default bindings off this.
target_devices:
  - xbox-series
  - keyboard
