# novadeck gamescope-session configuration (sourced by /usr/bin/novadeck-session, sh syntax).

# NOVADECK_SESSION_CMD — the client launched inside gamescope.
#   Phase 2: a liveness placeholder (vkcube).
#   Phase 3 (now): the native arm64 Steam shell launcher. novadeck-steam sets HOME +
#     LD_LIBRARY_PATH and execs the native client (steamrtarm64/steam) in gamepad/Deck UI mode.
#     The Steam tree ships PRE-SEEDED in the /home partition (make-sdcard.sh), so the client is
#     already present at launch. To fall back to the liveness placeholder, set "vkcube".
NOVADECK_SESSION_CMD="novadeck-steam"

# NOVADECK_GAMESCOPE_EXTRA — extra gamescope flags appended after the HW-validated base set
# (--backend drm -W <w> -H <h> -r <hz>; panel rotation is auto-detected from the DRM connector
# orientation via the composite-rotation patch, no flag). Normally empty.
NOVADECK_GAMESCOPE_EXTRA=""

# NOVADECK_GAMESCOPE_W / _H — the LANDSCAPE logical output size gamescope renders at (the panel's
# portrait native mode swapped to landscape). Leave UNSET to auto-detect from the connected DSI
# connector at runtime (falls back to 1920x1080). Pin only to override detection.
#NOVADECK_GAMESCOPE_W=1920
#NOVADECK_GAMESCOPE_H=1080

# NOVADECK_GAMESCOPE_REFRESH — output refresh in Hz (-r). sysfs does not expose the native rate, so
# this is a plain default (60); gamescope clamps to the panel's nearest supported mode.
#NOVADECK_GAMESCOPE_REFRESH=60

# NOVADECK_GAMESCOPE_OUTPUT — DRM connector to scan out (--prefer-output, e.g. DSI-1). Leave UNSET to
# auto-pick the largest connected DSI panel at runtime. Override to force a specific connector.
#NOVADECK_GAMESCOPE_OUTPUT=DSI-1

# GAMESCOPE_DEBUG_FOCUS — focus-selection diagnostic. Turns on gamescope's debug_focus_candidates
# convar (packages/gamescope/patches/0006), which logs why each window is or is not a focus
# candidate, which one wins, and its commit-queue state. This is what localized the Steam
# client-update black screen (fixed by patches/0005) and the Lepton baselayer-appid reorder (fixed
# by patches/0008); see docs/worklog/DONE.md — keep it for the next one.
# Sourced by novadeck-session, so `export` here is what reaches gamescope — which is the only way to
# have it on at BOOT, before SSH is up and `gamescopectl debug_focus_candidates 1` is reachable.
# Output goes to ~/.local/share/sddm/wayland-session.log (not the journal); grep it for `cand:`.
# Diagnostic only. The patch it depends on (patches/0006) is deliberately NOT in source.pin, so on a
# stock build this variable does nothing — re-add 0006 to source.pin first, then uncomment here.
#export GAMESCOPE_DEBUG_FOCUS=1

# APP_WANTS_FLATSCREEN — make a Steam-launched Lepton (Android) title present a 2D screen instead of
# running headless.
#
# liblepton/app_metadata.sh decides it with:
#     if ! is_steamlaunch && ! is_app; then APP_WANTS_FLATSCREEN="true"; fi
#     [[ "${APP_WANTS_FLATSCREEN:-false}" == "true" ]] || [[ -f "${APP_DIR}/lepton-show-flatscreen" ]]
# A Steam launch never takes that first branch, so without one of those two switches properties.sh
# sets lepton.headless=true and omits waydroid.wayland_display entirely: Android boots and the app
# renders internally, the composer presents a single frame and tears its surface down, and the panel
# keeps Steam. That — not graphics, not focus — is the long-standing dev-path-works/Steam-path-blank
# split. (Focus is a SEPARATE defect, fixed by packages/gamescope/patches/0008.)
#
# UNTESTED, deliberately shipped anyway because the failure mode is silent and costly to re-derive.
# What IS confirmed on HW (2026-08-24, Age of Gods appid 4545850) is the per-title marker file. This
# variable is inferred from the `${APP_WANTS_FLATSCREEN:-false}` read being satisfiable from the
# environment; whether it survives into Lepton's shell — rather than being initialized by Lepton
# before that test — has NOT been shown. It is preferred over the marker if it works: one lever for
# every title, surviving reinstalls, instead of a file per game that a reinstall deletes.
#
# Verify: launch an Android title, then `adb shell getprop lepton.headless`. `false` means this
# reached Lepton. If it reads `true`, this variable is dead and the marker file
# (${STEAM_COMPAT_INSTALL_PATH}/lepton-show-flatscreen, written per title at install time) is the
# only lever — see the lepton-steam-path-is-headless memory.
export APP_WANTS_FLATSCREEN=true
