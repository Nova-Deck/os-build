# Sunshine, as novadeck-sunshine.service runs it. Keys not set here keep Sunshine's defaults.

# gamescope has no portal and no KWin: KMS is the only capture. Encoding is iris, through VA-API.
capture = kms
encoder = vaapi

# The web UI and its API answer this device only. The Decky plugin is their client.
origin_web_ui_allowed = pc

# One entry, the whole session, which runs no command. Sunshine's own list has a "Low Res Desktop"
# and a "Steam Big Picture" that run commands which do not exist here.
file_apps = /usr/share/novadeck/sunshine-apps.json

# Made at every start by /usr/lib/novadeck/sunshine-creds. Pairings are NOT here: they stay in
# Sunshine's own state file under ~/.config/sunshine.
credentials_file = /run/novadeck-sunshine/credentials.json

# Not debug: that level writes every web request's headers.
min_log_level = info
log_path = /run/novadeck-sunshine/sunshine.log
