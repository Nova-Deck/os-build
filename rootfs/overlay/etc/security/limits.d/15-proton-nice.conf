# novadeck: let Proton raise its own thread priorities.
#
# Proton maps a game's Windows thread base-priority classes onto Linux niceness with setpriority(2),
# per thread, from inside the game process (docs/THREAD_PRIORITY.md in the Proton tree). An
# unprivileged process cannot lower its nice at all by default — RLIMIT_NICE starts at 0 — so
# without this file every one of those calls fails EACCES and every game thread runs at nice 0 no
# matter what the game asked for. Nothing surfaces the failure: the game simply does not get the
# scheduling it was written to expect.
#
# It lands under security/ because that is the only place pam_limits looks, and it takes effect at
# all only because our SDDM autologin stack runs pam_limits: etc/pam.d/sddm-autologin includes
# system-login, which carries it. A drop-in at /etc/limits.d — same name, no `security/` — is read
# by nothing, which is exactly where SteamOS shipped this file from 2022 until August 2026; the
# feature was silently inert for that whole stretch. Cheap mistake to repeat, so: the path is the
# load-bearing part of this file, not the number.
#
# -8, not the -15 the Proton doc suggests, and the reason is the audio graph: pipewire.conf asks
# module-rt for nice.level -11 (see rootfs/customize-base.sh for why rtkit has to be on the bus
# before that request means anything). A -15 ceiling would let a game promote its own threads above
# PipeWire's, trading audio scheduling for game latency nobody has measured a need for. -8 keeps
# every self-promoted game thread underneath it.
#
# This is a CEILING for unprivileged self-promotion and nothing else. novadeck_perf's per-game
# `nice` tweak is unaffected — novadeck-powerd runs as root, applies its value uniformly across a
# whole game process tree, and still reaches -20. The two are complementary: ours cannot tell a
# render thread from a worker, and Proton's is the only one that can.
#
# `hard` alone raises the ceiling; the process must still lift its own soft limit to it, which is
# the form Valve ships and the Proton doc prescribes. Confirm on hardware with
# `grep 'Max nice' /proc/<game-pid>/limits` inside a running Proton tree, then check that its
# threads actually land negative.
#
# <domain>  <type>  <item>  <value>
*           hard    nice    -8
