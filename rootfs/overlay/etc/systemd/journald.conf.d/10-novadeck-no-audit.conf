# novadeck: tell the kernel to stop generating audit events.
#
# The kernel is built with CONFIG_AUDIT=y (defconfig default) and nothing on the cmdline turns it
# off, and journald's stock Audit=yes switches kernel auditing ON when it starts. Nothing here
# consumes audit records: no auditd, no SELinux/AppArmor. All auditing buys us is per-syscall audit
# work and audit: lines (every login, sudo, service start) written into a journal on an SD card.
#
# Audit=no makes journald send AUDIT_SET enabled=0 at startup, so this is the runtime equivalent of
# `audit=0` without a kernel rebuild or cmdline change. It does NOT stop journald from collecting
# records if something else re-enables auditing; that is systemd-journald-audit.socket's job.
[Journal]
Audit=no
