# Hand the display from the boot splash to the session, in that order.
#
# THIS IS THE STEP THAT FAILED LAST TIME, so it is worth being explicit about why it is shaped
# like this. DRM master is exclusive. The splash drawer takes it in the initramfs and holds it —
# it has to, because a masterless process cannot keep the kernel's own fbdev console from
# stealing the scanout. gamescope needs master before it can put up a single frame. So there is
# no arrangement in which the splash waits for gamescope to signal readiness: gamescope cannot
# get far enough to signal anything while the splash still holds the device. The previous
# attempt was built on exactly that impossible handshake and produced
# "seatd: Could not make device fd drm master: Device or resource busy" followed by a black
# panel for the rest of the session, because gamescope never retries master once it has lost it.
#
# The fix is that the splash must be gone BEFORE the session opens the DRM device, and the only
# thing that knows when that is about to happen is the display manager's own start.
#
# ExecStartPre runs before sddm's main process, so writing the takeover file here is strictly
# ordered ahead of anything gamescope does. The drawer sees a value that is not its own pid,
# drops master, waits until the CRTC provably names a different framebuffer, and only then lets
# go of its own — releasing earlier destroys the framebuffer mid-scan, which is its own black
# screen. It exits on its own; nothing needs to kill it.
#
# `-` on the line so a failure to write the file cannot stop the display manager. A splash that
# will not yield is a bad boot; a display manager that will not start is a brick.
[Service]
ExecStartPre=-/bin/sh -c 'mkdir -p /run/novadeck/splash && echo sddm >/run/novadeck/splash/takeover'
