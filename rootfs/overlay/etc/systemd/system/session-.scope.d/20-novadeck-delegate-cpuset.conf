# Let novadeck-powerd hold a game to its `cores` with a cpuset (see novadeck_cpuset.py).
#
# Delegation does two things, both needed: systemd passes the cpuset controller down to the scope
# (root, user.slice and user-1000.slice otherwise enable only cpu, memory and pids), and it leaves the
# cgroups below the scope alone. Only cpuset is listed, so nothing else about the session's resource
# control changes. Nothing is restricted until powerd sets a cpuset, and a session that never runs
# such a game is never rearranged.
#
# Verify on device, in a session started after this file was installed:
#   cat /sys/fs/cgroup/user.slice/user-1000.slice/session-*.scope/cgroup.controllers   # has cpuset
[Scope]
Delegate=cpuset
