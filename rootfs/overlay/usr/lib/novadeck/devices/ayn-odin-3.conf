NOVADECK_DEVICE_ID=ayn-odin-3
NOVADECK_DEVICE_NAME='AYN Odin 3'
NOVADECK_SOC_CLASS=SM8750

NOVADECK_PRIMARY_CONNECTOR=DSI-1
NOVADECK_PANEL_NATIVE_WIDTH=1080
NOVADECK_PANEL_NATIVE_HEIGHT=1920
# icna3520: two fixed modes (60/120); the exact rates are frame-length
# calibrated per device over the panel's sysfs knobs (kernel patch 0533).
NOVADECK_PANEL_REFRESH_RATES=60,120
NOVADECK_GAMESCOPE_FAKE_OUTPUT_MM=177x100
# INHERITED, NOT MEASURED: 650 is the published figure for the chipone,icna3520 AMOLED as profiled
# by its upstream authors, and this board drives that panel. A defensible starting value, not a
# verified one: nobody has put a meter on this screen. If HDR content looks wrong, suspect it first.
NOVADECK_PANEL_HDR_NITS=650
