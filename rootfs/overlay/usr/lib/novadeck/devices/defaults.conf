# novadeck device-env defaults — sourced first, then overlaid by the matched
# <profile>.conf. An unrecognised board falls through with these values.
NOVADECK_DEVICE_ID=unknown
NOVADECK_DEVICE_NAME=unknown
NOVADECK_SOC_CLASS=

NOVADECK_PRIMARY_CONNECTOR=
NOVADECK_PANEL_TYPE=internal
# portrait = the native mode is swapped into the landscape logical canvas (the fleet norm);
# landscape = the native mode already is that canvas, nothing to swap or rotate.
NOVADECK_PANEL_ORIENTATION=portrait
NOVADECK_PANEL_NATIVE_WIDTH=
NOVADECK_PANEL_NATIVE_HEIGHT=
NOVADECK_PANEL_REFRESH_RATES=
# The SteamUI scale lever, and the ONLY one — HW-confirmed on a Thor Lite: halving this doubles the
# reported DPI and the UI grows to match. It is a UI-DENSITY value, not a panel size: the fleet's
# 16:9 boards all declare 177x100 so every board lands at the same ~10.8 px/mm, and a non-16:9 board
# holds the vertical 100mm and derives its width. The panel's real mm (from the DRM connector, and
# now also from the synthesized EDID) do NOT drive scale — the Steam client stopped honouring them
# in 2026-07. Empty lets gamescope report the connector's own mm. Aspect-match it to the LANDSCAPE
# logical -W/-H, else the two axes disagree on DPI.
NOVADECK_GAMESCOPE_FAKE_OUTPUT_MM=
# Panel peak luminance in nits, and the HDR master switch: 0 = SDR. Non-zero hands the panel's
# identity and peak to the display profile (/usr/share/gamescope/scripts/10-novadeck/), which is
# what tells gamescope this EDID-less panel can do HDR, and lets Steam show its HDR toggle. It
# passes gamescope NO HDR flag: Steam owns the HDR state at runtime, so HDR stays off until the
# user turns it on.
#
# Only set it on a board whose DPU carries per-plane colour pipelines (kernel 0394: SM8550,
# SM8650, SM8750; 0398: SM8250). Elsewhere every HDR frame has to be composited, which costs the
# board its direct scanout and the rotation that rides on it.
#
# A PER-PANEL number. Do not copy one board's value to another because the panels look alike:
# two boards can share a DDIC and not a panel.
NOVADECK_PANEL_HDR_NITS=0
# Full-frame average luminance for HDR (MaxFALL) in nits. Empty = half the peak: an OLED dims large
# bright areas, so a full frame at the small-window peak is not something it can hold. Set it equal
# to the peak only for a panel profiled that way (the icna3520 boards, after armada's profile).
NOVADECK_PANEL_HDR_FALL=
# fake = fake-suspend (real suspend hangs these SoCs); mem = suspend-to-RAM.
NOVADECK_SUSPEND_MODE=fake
