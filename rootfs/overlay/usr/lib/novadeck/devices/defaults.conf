# novadeck device-env defaults — sourced first, then overlaid by the matched
# <profile>.conf. An unrecognised board falls through with these values.
NOVADECK_DEVICE_ID=unknown
NOVADECK_DEVICE_NAME=unknown
NOVADECK_SOC_CLASS=

NOVADECK_PRIMARY_CONNECTOR=
NOVADECK_PANEL_TYPE=internal
NOVADECK_PANEL_NATIVE_WIDTH=
NOVADECK_PANEL_NATIVE_HEIGHT=
NOVADECK_PANEL_REFRESH_RATES=
# The SteamUI scale lever, and the ONLY one — HW-confirmed on a Thor Lite: halving this doubles the
# reported DPI and the UI grows to match. It is a UI-DENSITY value, not a panel size: the fleet's
# 16:9 boards all declare 177x100 so every board lands at the same ~10.8 px/mm, and a non-16:9 board
# holds the vertical 100mm and derives its width. The panel's real mm (from the DRM connector, and
# now also from the synthesized EDID) do NOT drive scale — the Steam client stopped honouring them
# in 2026-07. Empty lets gamescope report the connector's own mm. Aspect-match it to the LANDSCAPE
# logical -W/-H, else the two axes disagree on DPI.
NOVADECK_GAMESCOPE_FAKE_OUTPUT_MM=
# fake = fake-suspend (real suspend hangs these SoCs); mem = suspend-to-RAM.
NOVADECK_SUSPEND_MODE=fake
