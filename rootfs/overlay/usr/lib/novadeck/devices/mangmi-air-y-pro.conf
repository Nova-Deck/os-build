NOVADECK_DEVICE_ID=mangmi-air-y-pro
NOVADECK_DEVICE_NAME='MANGMI Air Y Pro'
NOVADECK_SOC_CLASS=SM8250

# MANGMI Air Y Pro (sm8250-mangmi-air-y-pro.dts). Same SoC, PMICs, codec set and SPI MCU joypad
# family as the Pocket Max; what differs is the display and touch: a LANDSCAPE-NATIVE 1280x960 4:3
# panel (mangmi,air-y-pro-panel, kernel/patches/0580, one 60 Hz video mode, no DTS rotation) on the
# pm8150l WLED backlight + LCDB bias, and a Hynitron CST66xx touch controller (0736).
#
# LANDSCAPE: novadeck-session normally swaps a portrait native mode into the landscape logical
# canvas; NOVADECK_PANEL_ORIENTATION=landscape tells it the native mode already IS that canvas, and
# boot/gen-grub-cfg.sh gives this board GRUB rotation 0 for the same reason.
NOVADECK_PANEL_ORIENTATION=landscape
NOVADECK_PRIMARY_CONNECTOR=DSI-1
NOVADECK_PANEL_NATIVE_WIDTH=1280
NOVADECK_PANEL_NATIVE_HEIGHT=960
NOVADECK_PANEL_REFRESH_RATES=60
# 4:3, so per defaults.conf hold the vertical 100 mm and derive the width: 133x100. Not yet checked
# against SteamUI on this panel.
NOVADECK_GAMESCOPE_FAKE_OUTPUT_MM=133x100
