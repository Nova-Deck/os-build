NOVADECK_DEVICE_ID=mangmi-pocket-max
NOVADECK_DEVICE_NAME='MANGMI Pocket Max'
NOVADECK_SOC_CLASS=SM8250

NOVADECK_PRIMARY_CONNECTOR=DSI-1
NOVADECK_PANEL_NATIVE_WIDTH=1080
NOVADECK_PANEL_NATIVE_HEIGHT=1920
NOVADECK_PANEL_REFRESH_RATES=60,90,120,144
NOVADECK_GAMESCOPE_FAKE_OUTPUT_MM=177x100
# 800 is MANGMI's published peak for this panel -- a VENDOR SPEC, not a meter reading, and vendor
# peaks are usually small-window figures the panel cannot hold full-screen. The right number to start
# from and the first to doubt if bright HDR scenes look clipped or the panel dims on large white areas.
# Deliberately NOT the Thor Lite's 650: this is mangmi,pocket-max-panel, its own panel_desc, even
# though the chipone ICNA35XX driver binds it. HDR scanout HW-passed here 2026-11-14 (kernel 0398).
NOVADECK_PANEL_HDR_NITS=800
