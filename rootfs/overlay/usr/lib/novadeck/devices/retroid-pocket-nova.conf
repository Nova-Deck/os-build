NOVADECK_DEVICE_ID=retroid-pocket-nova
NOVADECK_DEVICE_NAME='Retroid Pocket Nova'
NOVADECK_SOC_CLASS=SM8550

NOVADECK_PRIMARY_CONNECTOR=DSI-1
# Native LANDSCAPE 4:3 panel (4.5", Ilitek IL97680A) — unlike the rest of the fleet
# there is no DTS rotation, so these are already the scanout dimensions.
NOVADECK_PANEL_NATIVE_WIDTH=1280
NOVADECK_PANEL_NATIVE_HEIGHT=960
NOVADECK_PANEL_REFRESH_RATES=60,120
# 4:3, so NOT the fleet's 16:9 177x100: 120x90 keeps the panel aspect exact at
# ~10.7 px/mm on both axes, within ~1% of the fleet's 10.8 declared density. The real
# panel (91x68 mm) makes SteamUI far too big — see the fake-output-mm note in device-env.
NOVADECK_GAMESCOPE_FAKE_OUTPUT_MM=120x90
