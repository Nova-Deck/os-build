# Network sysctl tuning. Overrides the base 10-arch.conf / 50-default.conf drop-ins (higher prefix
# wins).

# Packetization-layer path MTU discovery (RFC 4821) when full-size packets vanish. Measured on the
# Pocket FIT over home Wi-Fi (2026-10-22): the path to GOG's CDN had an MTU of 1492 (a 1472-byte
# don't-fragment ping came back "mtu = 1492"), yet a gogdl connection kept pmtu 1500 and sat with
# its full-size packet unacknowledged in Send-Q, while pings and small requests passed. So every
# connection whose first full-size packet is a TLS hello could stall: store art, legendary info and
# Steam's own runtime download all timed out that day. A handheld joins whatever network it is on,
# and cannot count on the router clamping MSS or the ICMP that path MTU discovery needs arriving.
# With 1 the kernel, once such a connection has timed out retransmitting, retries with
# tcp_base_mss-sized segments (1024 bytes) and grows them again as they get through; a healthy path
# never triggers it. Not 2 (always probe), which would start every connection small.
net.ipv4.tcp_mtu_probing=1
