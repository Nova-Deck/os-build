# novadeck earlyoom policy — a userspace OOM killer, tuned for a handheld with no console.
#
# WHY EARLYOOM AT ALL: before this the device had NO userspace OOM protection. systemd-oomd is
# installed (it comes with systemd) but ships disabled and nothing enabled it, so the only backstop
# was the kernel OOM killer — which by design waits until allocation has actually failed, by which
# point the device has usually been unresponsive for a while. On a box whose only input is a
# gamepad and whose only debug path is SSH over Wi-Fi, "unresponsive for a while" means a power
# cycle. earlyoom watches MemAvailable and free swap and acts before the cliff.
#
# ABSOLUTE THRESHOLDS, NOT PERCENTAGES, and that is deliberate. The supported devices span 8 GB to
# 16 GB of RAM (see kernel/dts/qcom — Odin 2, AYANEO Pocket, RP6 all ship several SKUs), so a
# percentage means a different amount of memory on every unit: the stock -m 10,5 would start
# SIGTERMing with ~1.5 GB still available on a 16 GB device while barely reacting on an 8 GB one.
# 400 MB / 300 MB is the same headroom everywhere, which is what the reserve is actually for.
#
# BOTH conditions must hold before it acts (earlyoom(1): "sends SIGTERM once BOTH available memory
# AND free swap are below their respective settings"), so -S matters only once a swap device exists
# — which it now does, see rootfs/overlay/usr/lib/systemd/zram-generator.conf. Giving -S the same
# absolute numbers means we only start killing when the zram device is nearly exhausted too, rather
# than on the first dip in RAM while there is still gigabytes of compressed swap to use.
#
# -r 0 IS LOAD-BEARING, not tidying. earlyoom's default report interval is 1.0 SECOND, so the stock
# configuration writes a memory-report line to the journal every second, forever. This device's
# journal is offloaded onto the /home partition (novadeck-offload.target) on an SD card; a line per
# second is the kind of write volume that is both a card-wear problem and enough noise to bury the
# next real bug. Reports add nothing we cannot get on demand. Killing decisions are unaffected —
# earlyoom polls at its own adaptive rate regardless of this setting.
#
# --ignore vs --avoid, and why the split:
#   --ignore is a HARD exclusion (earlyoom will never pick these, and will sacrifice something else
#     instead). Reserved for the processes whose death is not a lost game but an unrecoverable
#     device: PID 1 and its helpers, the compositor, the display manager, the seat broker, and the
#     system bus. There is no desktop to fall back to here — if gamescope dies the screen goes
#     black with no way for a gamepad to get it back.
#     Xwayland is listed SEPARATELY from gamescope on purpose: it is gamescope's child, not part of
#     it, so a pattern matching `gamescope` does not cover it — and every X11 client on the image
#     (the Steam client included) is connected to it, so losing it empties the screen just as
#     completely. The packaged default this file replaces protected `Xorg`, which is the same
#     intent aimed at a binary we do not run.
#   --avoid is only a -300 bias on oom_score, i.e. a preference, NOT immunity. Used for the rest of
#     the session spine: losing the Steam client or PipeWire is very bad but recoverable, and making
#     them unkillable could leave earlyoom with nothing large enough left to free.
#   novadeck-.* rather than the individual names: comm is truncated to 15 bytes, and
#     novadeck-powerbuttond and novadeck-session both exceed that, so listing them by full name
#     would silently match nothing. Same reason for the pipewire.*/sddm.*/systemd-.* prefixes.
#
# --prefer IS DELIBERATELY UNSET. Without it earlyoom picks the highest oom_score, which under load
# is the game — which is the victim we want. Every regex that would name games explicitly relies on
# comm, and a Proton title's comm is a 15-byte truncation of an arbitrary .exe name, so such a
# pattern would be wrong more often than right. Do not add one without evidence from a real OOM.
#
# The reserved names are read from EARLYOOM_ARGS_NOVADECK and applied BEFORE $EARLYOOM_ARGS, which
# is whatever /etc/default/earlyoom sets — so a value there still wins (later argument), and this
# drop-in configures the default without owning that file.
#
# THAT ONLY HOLDS BECAUSE WE EMPTY THAT FILE. The earlyoom package ships it with an active
# EARLYOOM_ARGS setting -r, -n and --avoid, and earlyoom parses with getopt: the last occurrence of
# an option wins outright, so a second --avoid REPLACES the first instead of adding to it. Shipped
# as packaged, the file did not extend this policy, it displaced the overlapping half of it —
# measured on hardware, the device chose the packaged --avoid list and ignored every name above,
# and -r 0 was overridden back to hourly reports. -M, -S and --ignore survived only because the
# packaged file does not happen to set them.
#
# So rootfs/overlay/etc/default/earlyoom overwrites it with a comments-only version. It stays the
# operator override surface it was always meant to be (a device is reachable over SSH, and an
# EARLYOOM_ARGS set there still wins on any option it names) — it just no longer arrives with
# generic desktop defaults already in it. Both files have to be read together to see the whole
# precedence story; neither is complete on its own.

[Service]
Environment="EARLYOOM_ARGS_NOVADECK=-r 0 -M 409600,307200 -S 409600,307200 --ignore ^(systemd|systemd-.*|gamescope|Xwayland|sddm.*|seatd|dbus-broker)$ --avoid ^(steam.*|pipewire.*|wireplumber|NetworkManager|sshd|inputplumber|novadeck-.*|rauc)$"

ExecStart=
ExecStart=/usr/bin/earlyoom $EARLYOOM_ARGS_NOVADECK $EARLYOOM_ARGS
