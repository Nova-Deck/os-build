# novadeck zram swap — a compressed swap device in RAM, sized at half of physical memory.
#
# WHY: this device had no swap at all, on a target that spans 8 GB SKUs and runs x86 games under
# FEX/Proton (two address spaces, JIT caches, shader caches — memory-hungry in a way native aarch64
# software is not). Without swap the kernel's only reclaim option for anonymous pages is to OOM, so
# every allocation spike had to be paid for by killing something.
#
# It also completes a tuning knob that was already shipped but inert: 60-novadeck-gaming.conf sets
# vm.swappiness=180, which is meaningless without a swap device and is exactly right WITH a zram one
# (a high swappiness tells the kernel that swapping to zram is cheaper than dropping page cache,
# which for RAM-backed compressed swap it genuinely is).
#
# NO DISK IS INVOLVED — this is RAM compressed in RAM. That is what makes it acceptable here: the
# root is read-only, /var is a 256 MB partition, and the only writable bulk storage is an SD card
# where a swap file would be both slow and a wear problem.
#
# ram/2 with zstd: the conventional pairing, and the same shape the reference handheld platform
# ships. zstd trades a little more CPU per page than lz4 for a materially better ratio, which is the
# right trade when the constraint is memory and there are 8 big cores to spare. Note the accounting:
# the device is sized at half of RAM but only consumes the memory actually needed to store what has
# been swapped into it, compressed.
#
# swap-priority is set explicitly so that if a real swap device is ever added (the install-to-UFS
# work), zram is preferred over it rather than the order being whatever systemd happened to mount
# first.
#
# REQUIRES A KERNEL WITH ZRAM. CONFIG_ZRAM and CONFIG_ZRAM_BACKEND_ZSTD were off in every kernel
# before this and were added to kernel/kernel.config alongside this file; kernel/build.sh asserts
# they survived olddefconfig, because the failure mode is otherwise silent (no zram0, no swap, no
# error, and a swappiness of 180 doing nothing).
#
# zswap is NOT disabled here, unlike the reference platform's version of this config: our kernel has
# CONFIG_ZSWAP off entirely, so there is nothing to turn off and a tmpfiles line poking at
# /sys/module/zswap/parameters/enabled would be writing to a path that does not exist.

[zram0]
# Half of physical RAM, after discounting what the kernel itself has reserved.
zram-size = ram/2
compression-algorithm = zstd
swap-priority = 100
fs-type = swap
