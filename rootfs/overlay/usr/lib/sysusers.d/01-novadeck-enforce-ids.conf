# novadeck — pin every dynamically-allocated system UID/GID.
#
# WHY THIS FILE EXISTS — the numbers below are NOT chosen, they are RECORDED. Packages that ship a
# sysusers.d entry with `-` for the id let systemd-sysusers allocate one, and it allocates by
# counting DOWN from 999 in whatever order the transaction settles. So the id a service gets is a
# function of the package SET, not of the service: add one package with a sysusers entry and every
# id below it in the range shifts by one. That already happened here — rootfs/assemble-rootfs.sh
# carried a comment naming sddm as uid 965 while the tree it described was shipping 967.
#
# On a normal Arch box that drift is invisible, because /etc/passwd is created once and then
# persists. On this image it is a correctness bug, because of two things we do:
#
#   1. /etc/passwd is BAKED AT BUILD TIME. It ships in the read-only root, so its contents are a
#      property of the build that produced it, not of the device.
#
#   2. rootfs/overlay/usr/lib/rauc/post-install.sh copies the RUNNING /var wholesale into the freshly
#      reformatted target slot. An update therefore lands version N's file OWNERSHIP (numeric uids,
#      recorded in the inodes) underneath version N+1's /etc/passwd. Same exposure on /home, which
#      persists the offload tree across every update: /var/log (systemd-journal), /var/lib/flatpak
#      and /var/lib/systemd/coredump (systemd-coredump) all live there.
#
# So an OTA that merely ADDS a package can leave persisted state owned by a uid that now belongs to
# a different service, or to nobody. Pinning the range makes an id a property of the DISTRO instead
# of a property of one build.
#
# ORDERING IS THE MECHANISM. systemd-sysusers reads sysusers.d in lexicographic order and the FIRST
# definition of a name wins; every later one is ignored. The `01-` prefix puts this file ahead of
# alpm.conf, basic.conf, sddm.conf and the rest, so these ids are assigned before anything can
# allocate. That also means each `u` line has to repeat the gecos and home the owning package would
# have set — a `-` here would win and give e.g. sddm a home of `/` instead of /var/lib/sddm.
#
# It has to be in the target root BEFORE the pacman transaction that triggers the sysusers hook, so
# rootfs/customize-base.sh stages this exact file in early and folds its sha256 into the base
# reuse key. It also SHIPS (this path), so the device's own boot-time sysusers run agrees.
#
# CHANGING A NUMBER HERE IS A BREAKING CHANGE. Existing devices carry these ids in the inodes of
# /home and their /var; renumbering orphans that state. New entries go at the BOTTOM of the range
# (966 and down), never by reshuffling. rootfs/guard-rootfs.sh asserts the built tree matches.
#
# Recorded from work/base/etc/{passwd,group} on 2026-07-30, snapshot mash-20251118.3. Ids outside
# 967-999 are already explicit in their own packages (root 0, dbus 81, polkitd 102, deck 1000, the
# low Arch groups) and are deliberately not restated — this file owns exactly the allocated range.

# --- groups from systemd's basic.conf (allocated 999 downward) ---
g adm     999 -
g wheel   998 -
g utmp    997 -
g audio   996 -
g clock   995 -
g disk    994 -
g input   993 -
g kmem    992 -
g kvm     991 -
g lp      990 -
g optical 989 -
g render  988 -
g sgx     987 -
g storage 986 -
g uucp    985 -
g video   984 -
g users   983 -

# --- groups from other packages, no matching user ---
# NO TRAILING COMMENTS on these lines. sysusers.d has no end-of-line comment syntax: a `#` after the
# fields is parsed as the HOME field and the whole line is REJECTED ("'#' is not a valid home
# directory field") — which drops the pin for that name silently, leaving it allocated again.
# Measured: written with trailing comments naming the owning package, all four below were skipped.
# Owning packages, for the record: shadow.conf, systemd-journal.conf, util-linux.conf, seatd.conf.
g groups          982 -
g systemd-journal 981 -
g rfkill          980 -
g seat            971 -

# --- users (each also fixes the like-named group at the same id) ---
# gecos + home repeated from the owning package: the first definition wins outright.
u systemd-coredump       979 "systemd Core Dumper"                -
u systemd-network        978 "systemd Network Management"          -
u systemd-oom            977 "systemd Userspace OOM Killer"        -
u systemd-journal-remote 976 "systemd Journal Remote"              -
u systemd-resolve        975 "systemd Resolver"                    -
u systemd-timesync       974 "systemd Time Synchronization"        -
u tss                    973 "tss user for tpm2"                   -
u uuidd                  972 "UUID generator helper daemon"        /var/lib/libuuid
u alpm                   970 "Arch Linux Package Management"       -
u avahi                  969 "Avahi mDNS/DNS-SD daemon"            -
u pcscd                  968 "PC/SC Smart Card Daemon"             -
u sddm                   967 "SDDM Greeter Account"                /var/lib/sddm
