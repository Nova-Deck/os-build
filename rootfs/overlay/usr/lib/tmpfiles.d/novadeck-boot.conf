# novadeck runtime state directory.
#
# 'd' (create if absent), NEVER 'D'. 'D' empties the directory on boot, which would delete
# /run/novadeck/boot -- the handoff the initramfs writes before switch_root recording which A/B
# slot it selected and why. That file is the only evidence of the boot decision, and
# novadeck-bootctl reads it to know which slot it is running on.
#
# The session subdir is deck-owned so novadeck-session (which runs as deck) can create its
# readiness marker there without any privilege: the ESP write stays in a root oneshot.
d /run/novadeck         0755 root root -
d /run/novadeck/session 0755 deck deck -
