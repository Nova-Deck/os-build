# Memory-management knobs that live in sysfs, not sysctl.
#
# 64 kB transparent huge pages for anonymous memory. arm64 maps a 64 kB folio with contiguous PTEs,
# so one TLB entry covers 16x the memory of a 4 kB page: on an SM8550 handheld random memory access
# measured +40%, 7-Zip +3.8%, shader compiles faster, game fps unchanged. The 2 MB size stays at
# the kernel's `madvise` (memory bloat and compaction stalls); this only opts the 64 kB size in.
w- /sys/kernel/mm/transparent_hugepage/hugepages-64kB/enabled - - - - always

# MGLRU thrashing protection, as ChromeOS sets it: keep the working set of the last second
# resident, and when that cannot be done OOM-kill instead of stalling the foreground game in
# reclaim. 0 (the kernel default) disables the protection.
w- /sys/kernel/mm/lru_gen/min_ttl_ms - - - - 1000
