# DisplayPort verb for the SM8250 boards that route DP audio (MANGMI Pocket Max,
# Retroid Pocket 5 / Flip2 / Mini / Mini V2).
#
#   DisplayPort: MultiMedia4 -> DISPLAY_PORT_RX -> mdss_dp over USB-C (hw:,3)
#
# A verb of its own, NOT a device in HiFi, and that is load-bearing. While no
# display is attached the ADSP refuses to start the DP port (q6afe "AFE enable
# for port 0x6020 failed -22"), so every open of this PCM fails. PipeWire opens
# every PCM of a verb when it probes the verb's profile, and one failure rejects
# the whole profile: with DP inside HiFi, an undocked handheld lost its speakers
# and headphones too. Here the failure costs only this profile, which becomes
# usable once a display is attached.
#
# The route is set by the verb rather than by the device, because probing opens
# the PCM without running device sequences; unrouted, the open fails on "no
# backend DAIs" even with a display attached.

SectionVerb {
	EnableSequence [
		cset "name='DISPLAY_PORT_RX Audio Mixer MultiMedia4' 1"
	]

	DisableSequence [
		cset "name='DISPLAY_PORT_RX Audio Mixer MultiMedia4' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."DisplayPort" {
	Comment "DisplayPort Playback"

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},3"
		PlaybackChannels 2
		PlaybackRate 48000
		JackControl "DP0 Jack"
	}
}
