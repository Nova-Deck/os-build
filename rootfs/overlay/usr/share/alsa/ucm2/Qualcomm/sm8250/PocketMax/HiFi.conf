# HiFi verb for the MANGMI Pocket Max (SM8250).
#
#   Headphones:  MultiMedia1 -> RX_CODEC_DMA_RX_0  -> rx-macro  -> wcd938x      (hw:,0)
#   Speakers:    MultiMedia2 -> WSA_CODEC_DMA_RX_0 -> wsa-macro -> wsa881x x2   (hw:,1)
#   Headset Mic: MultiMedia3 <- TX_CODEC_DMA_TX_3  <- tx-macro  <- wcd938x ADC2 (hw:,2)
#
# Unlike the Retroid Pocket profile this one does NOT include the shared
# wsa-macro/wsa881x SpeakerEnableSeq snippets: the board's speaker channels are
# swapped in hardware, so the enable path is spelled out here with WSA_RX0 INP0
# fed from RX1 and WSA_RX1 INP0 from RX0. The shared DISABLE snippets still
# apply and are included as-is.

SectionVerb {
	EnableSequence [
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='WSA_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones Playback"

	Include.wcdhpe.File "/codecs/wcd938x/HeadphoneEnableSeq.conf"
	Include.wcdhpd.File "/codecs/wcd938x/HeadphoneDisableSeq.conf"
	Include.rxmhpe.File "/codecs/qcom-lpass/rx-macro/HeadphoneEnableSeq.conf"
	Include.rxmhpd.File "/codecs/qcom-lpass/rx-macro/HeadphoneDisableSeq.conf"

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "HP"
		JackControl "Headphone Jack"
		JackHWMute "Speaker"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker Playback"

	EnableSequence [
		cset "name='WSA RX0 MUX' AIF1_PB"
		cset "name='WSA RX1 MUX' AIF1_PB"
		# The digital gain the speakers actually run on: 84 is unity, each
		# step is 1 dB, so 102 is +18 dB. This has to be here rather than in
		# a BootSequence, which nothing on the image executes — see
		# PocketMax.conf.
		#
		# 102 was chosen BY EAR on a Pocket Max, 2026-08-27. The inherited
		# value was 120 (+36 dB); it had never been applied on any of our
		# images, and the first time it was, it was far too loud. Do not
		# "restore" 120 on the grounds that other trees carry it — no tree
		# that carries it actually runs it.
		cset "name='WSA_RX0 Digital Volume' 102"
		cset "name='WSA_RX1 Digital Volume' 102"
		# Crossed on purpose — see the header.
		cset "name='WSA_RX0 INP0' RX1"
		cset "name='WSA_RX1 INP0' RX0"
		cset "name='WSA_COMP1 Switch' 1"
		cset "name='WSA_COMP2 Switch' 1"
		cset "name='SpkrLeft COMP Switch' 1"
		cset "name='SpkrLeft BOOST Switch' 1"
		cset "name='SpkrLeft DAC Switch' 1"
		cset "name='SpkrLeft VISENSE Switch' 0"
		cset "name='SpkrLeft PA Volume' 12"
		cset "name='SpkrRight COMP Switch' 1"
		cset "name='SpkrRight BOOST Switch' 1"
		cset "name='SpkrRight DAC Switch' 1"
		cset "name='SpkrRight VISENSE Switch' 0"
		cset "name='SpkrRight PA Volume' 12"
	]
	Include.wsamspkd.File "/codecs/qcom-lpass/wsa-macro/SpeakerDisableSeq.conf"
	Include.wsaspkd.File "/codecs/wsa881x/SpeakerDisableSeq.conf"

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},1"
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "Speakers"
	}
}

SectionDevice."Headset" {
	Comment "Headphone Microphone"

	EnableSequence [
		# Capture gain, moved out of the dead BootSequence with the rest.
		# The codec default is 0.
		cset "name='ADC2 Volume' 10"
	]

	Include.wcdmice.File "/codecs/wcd938x/HeadphoneMicEnableSeq.conf"
	Include.wcdmicd.File "/codecs/wcd938x/HeadphoneMicDisableSeq.conf"
	Include.txmhpe.File "/codecs/qcom-lpass/tx-macro/HeadphoneMicEnableSeq.conf"
	Include.txmhpd.File "/codecs/qcom-lpass/tx-macro/HeadphoneMicDisableSeq.conf"

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
		CaptureMixerElem "ADC2"
		JackControl "Mic Jack"
	}
}
