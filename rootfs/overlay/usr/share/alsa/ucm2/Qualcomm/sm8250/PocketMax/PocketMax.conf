Syntax 4

# MANGMI Pocket Max (SM8250). Card model = "PocketMax"
# (kernel/dts/qcom/sm8250-mangmi-pocket-max.dts).
#
# Same codec set as the Retroid Pocket boards — wcd9385 headphone/mic plus two
# wsa881x speakers on SoundWire — but the speaker channels are wired crossed,
# which the HiFi verb undoes in the WSA_RXn INP0 muxes rather than here.

Comment "MANGMI Pocket Max"

SectionUseCase."HiFi" {
	File "/Qualcomm/sm8250/PocketMax/HiFi.conf"
	Comment "Speakers, headphones and headset mic"
}

# No BootSequence, deliberately. NOTHING on the shipped image executes one.
# PipeWire/ACP does not (HW-verified on a Pocket Max: restarting WirePlumber moves
# only the route's own mixer element and leaves every other control at its register
# default), and the release image carries no alsa-utils and no ALSA units, so there
# is no alsactl/alsaucm to run it either. A gain policy written here is silently
# dead — which is what cost these speakers their gain (issue #63): WSA_RX* Digital
# Volume sat at 84 (0 dB) with nothing raising it. Note the 120 (+36 dB) this file
# used to ask for was itself never right; applied for the first time, it was far
# too loud. The value now in use is 102 (+18 dB), chosen by ear on the device.
#
# Everything it held now lives in the HiFi verb's device EnableSequences, which ACP
# does execute when it selects a route. HPHL/HPHR are deliberately NOT carried over:
# the codec default is 24 (+6 dB) and the old BootSequence asked for 20 (0 dB), so
# applying it would make headphones quieter than they are today.

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
Include.wcd-init.File "/codecs/wcd938x/init.conf"
Include.wsa-init.File "/codecs/wsa881x/init.conf"
Include.rxm-init.File "/codecs/qcom-lpass/rx-macro/init.conf"
