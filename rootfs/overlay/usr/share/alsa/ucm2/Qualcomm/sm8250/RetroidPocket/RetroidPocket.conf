Syntax 4

# Retroid Pocket 5 / Flip2 / Mini / Mini V2 (SM8250).
#
# All four boards share one sound card — sm8250-retroidpocket-common.dtsi sets
# model = "RetroidPocket" — so they share one profile and four conf.d symlinks.
#
# wcd9385 (wcd938x) headphone/mic + two wsa881x speakers on SoundWire, driven
# through the legacy q6asm/ADM path (SND_SOC_SM8250), not AudioReach.

Comment "Retroid Pocket"

SectionUseCase."HiFi" {
	File "/Qualcomm/sm8250/RetroidPocket/HiFi.conf"
	Comment "Speakers, headphones and headset mic"
}

# No BootSequence, deliberately. NOTHING on the shipped image executes one.
# PipeWire/ACP does not (HW-verified on a Pocket Max, which shares this codec set:
# restarting WirePlumber moves only the route's own mixer element and leaves every
# other control at its register default), and the release image carries no
# alsa-utils and no ALSA units, so there is no alsactl/alsaucm to run it either. A
# gain policy written here is silently dead — which is what cost these speakers
# their gain (issue #63): WSA_RX* Digital Volume sat at 84 (0 dB) with nothing
# raising it. Note the 120 (+36 dB) this file used to ask for was itself never
# right; applied for the first time, it was far too loud. The value now in use is
# 102 (+18 dB), chosen by ear on a Pocket Max and unjudged on Retroid hardware.
#
# Everything it held now lives in the HiFi verb's device EnableSequences, which ACP
# does execute when it selects a route. HPHL/HPHR are deliberately NOT carried over:
# the codec default is 24 (+6 dB) and the old BootSequence asked for 20 (0 dB), so
# applying it would make headphones quieter than they are today.

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
Include.wcd-init.File "/codecs/wcd938x/init.conf"
Include.wsa-init.File "/codecs/wsa881x/init.conf"
Include.rxm-init.File "/codecs/qcom-lpass/rx-macro/init.conf"
