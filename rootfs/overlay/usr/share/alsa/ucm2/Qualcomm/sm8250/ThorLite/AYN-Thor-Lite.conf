Syntax 4

# AYN Thor Lite (SM8250). Card model = "AYN Thor Lite"
# (kernel/dts/qcom/sm8250-ayn-thorlite.dts).
#
# The odd one out among the SM8250 boards: its speakers are a pair of AW88166
# amps on TERTIARY MI2S rather than wsa881x on SoundWire, so there are no
# WSA_* controls to initialise here. Headphone/mic is the same wcd9385.

Comment "AYN Thor Lite"

SectionUseCase."HiFi" {
	File "/Qualcomm/sm8250/ThorLite/HiFi.conf"
	Comment "Speakers, headphones and headset mic"
}

# Sane initial volumes. Without these the wcd938x comes up with the HPH analog
# volume near minimum and the rx-macro digital volumes low, which sounds like
# very quiet, intermittent headphone output rather than an obvious failure.
BootSequence [
	cset "name='HPHL Volume' 20"
	cset "name='HPHR Volume' 20"
	cset "name='ADC2 Volume' 10"
]

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
Include.wcd-init.File "/codecs/wcd938x/init.conf"
Include.rxm-init.File "/codecs/qcom-lpass/rx-macro/init.conf"
