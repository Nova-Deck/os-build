SectionDevice."HDMI0" {
        Comment "DisplayPort 0 playback"

        # The upstream (linux-firmware) topology feeds DisplayPort only from
        # MultiMedia5/6, and only MultiMedia6 is a PCM (device 5). Its route
        # is set by the verb (see SectionVerb), so this device has no
        # sequences.

        Value {
                PlaybackPriority 200
                PlaybackPCM "hw:${CardId},5"
                JackControl "DP0 Jack"
        }
}
