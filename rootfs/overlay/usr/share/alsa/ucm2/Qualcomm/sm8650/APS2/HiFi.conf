SectionDevice."HDMI0" {
        Comment "DisplayPort 0 playback"

        # The upstream (linux-firmware) topology feeds DisplayPort only from
        # MultiMedia5/6, and only MultiMedia6 is a PCM (device 5).
        EnableSequence [
                cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia6' 1"
        ]

        DisableSequence [
                cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia6' 0"
        ]

        Value {
                PlaybackPriority 200
                PlaybackPCM "hw:${CardId},5"
                JackControl "DP0 Jack"
        }
}
