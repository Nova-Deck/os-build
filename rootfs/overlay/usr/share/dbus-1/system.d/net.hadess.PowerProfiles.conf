<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  power-profiles-daemon compatibility, served by novadeck-powerd (which owns org.novadeck.Power
  and is the real source of truth for the power profile). We ship no power-profiles-daemon, so
  without this policy nothing answers these names.

  Careful when editing this comment: a double hyphen is illegal inside an XML comment, so writing
  the autopower flag with its leading dashes makes dbus-broker reject the whole file (it is
  stricter than dbus-daemon) and every name below silently stays unowned.

  BOTH names are here on purpose, and both are needed:

    net.hadess.PowerProfiles              scx_lavd in autopower mode hardcodes this name, path and
                                          interface with no fallback. Without it the scheduler
                                          silently stops following the power profile.
    org.freedesktop.UPower.PowerProfiles  glib's GPowerProfileMonitor uses only this one, so
                                          g_power_profile_monitor_dup_default() is dead without it.

  The system bus denies own="*" by default, so an <allow own> line per name is what makes the
  names acquirable at all — powerd logs "restoring CPU scheduler without full PPD ownership" and
  the coupling goes quiet if this file is missing or malformed.

  `wheel` may send, matching org.novadeck.Power.conf: deck is in wheel, and it can already set the
  profile through org.novadeck.Power1, so setting ActiveProfile grants no new privilege. scx_lavd
  runs as root out of scx.service and is covered by the root policy.
-->
<busconfig>
  <policy user="root">
    <allow own="net.hadess.PowerProfiles"/>
    <allow own="org.freedesktop.UPower.PowerProfiles"/>
    <allow send_destination="net.hadess.PowerProfiles"/>
    <allow send_destination="org.freedesktop.UPower.PowerProfiles"/>
  </policy>
  <policy group="wheel">
    <allow send_destination="net.hadess.PowerProfiles"/>
    <allow send_destination="org.freedesktop.UPower.PowerProfiles"/>
  </policy>
</busconfig>
