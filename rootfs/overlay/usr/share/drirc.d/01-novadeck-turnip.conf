<?xml version="1.0"?>
<!--
  novadeck additions to mesa's 00-turnip-defaults.conf (mesa reads every file in drirc.d, in order).

  heap_memory_percent: the device heap Turnip reports, as a share of RAM. Mesa's default is 75%;
  Valve ships 15/16 for every app on the Steam Frame (its 26.3 turnip defaults). The VRAM a game
  actually gets to plan around is capped separately: novadeck-steam enables the vram-report-limit
  layer at 4096 MiB for games (gfx.txt), as Valve does. This file is also staged into the FEX
  guest's x86 Turnip payload, which reads the guest's drirc.d.
-->
<driconf>
    <device driver="turnip">
        <application name="all-default">
            <!-- 15/16 -->
            <option name="heap_memory_percent" value="0.9375"/>
        </application>
    </device>
</driconf>
