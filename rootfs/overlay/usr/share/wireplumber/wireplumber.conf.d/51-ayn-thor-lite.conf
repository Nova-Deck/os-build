# AYN Thor Lite (SM8250) — force S16LE on the card's PCMs.
#
# The counterpart to Qualcomm/sm8250/ThorLite/HiFi.conf: the qdsp6 routing path
# opens its ADM COPP with NULL_COPP_TOPOLOGY, a bit-exact passthrough that does
# no sample-format conversion, and the MI2S / CODEC_DMA backends are hard-fixed
# to S16_LE by the kernel's sm8250_be_hw_params_fixup(). The MultiMedia frontend
# PCMs must therefore be opened S16LE too, or speaker and headphone output is
# noise rather than silence.
#
# Rate (48000) and channel count (2) are already pinned by the UCM profile via
# Playback/CaptureRate and Playback/CaptureChannels. UCM has no equivalent key
# for the sample format, so it is forced here instead.
#
# Scoped to this card by alsa.card_name (the `model` of the sound node in
# kernel/dts/qcom/sm8250-ayn-thorlite.dts), so it cannot affect the other
# SM8250 boards or any SM8550/SM8650 card. SPA-JSON, WirePlumber 0.5+.

monitor.alsa.rules = [
  {
    matches = [
      {
        alsa.card_name = "AYN Thor Lite"
      }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
      }
    }
  }
]
