# MANGMI Pocket Max (SM8250) — headphone sink never suspends.
#
# The headphones pop at random. HW-traced 2026-10-03: the pops line up with
# PipeWire suspending the idle sink (default 5 s after the last sound), which
# closes hw:,0 and powers the wcd938x HPH path down; the next sound powers it
# back up. With the sink held open no pop was heard over ~15 min of use, and the
# trace showed the PCM running throughout. Pinning the codec's platform device
# out of runtime PM did NOT stop them, so it is not carried.
#
# Cost: while headphones are the active output, the PCM, the ADSP path and the
# HPH amp stay up through idle. The speakers are untouched — they have their own
# amps and no pop has been reported on them.
#
# Scoped to the one PCM by api.alsa.path, like 52-pocket-max-dp.conf.
# SPA-JSON, WirePlumber 0.5+.

monitor.alsa.rules = [
  {
    matches = [
      {
        media.class = "Audio/Sink"
        api.alsa.path = "hw:PocketMax,0"
      }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
