# Retroid Pocket SM8250 boards (RP5, Flip 2, Mini, Mini V2) — DisplayPort sink over USB-C.
#
# The counterpart to the "HDMI" verb in Qualcomm/sm8250/DisplayPort.conf
# (MultiMedia4 -> DISPLAY_PORT_RX, hw:,3), enabled for these boards in RetroidPocket.conf.
# The DP backend runs 16-bit stereo at 48 kHz, so the frontend PCM is opened
# exactly that way, without mmap and with fixed 10 ms periods, instead of
# letting PipeWire negotiate. Same rule as 52-pocket-max-dp.conf; the card is
# "RetroidPocket" because sm8250-retroidpocket-common.dtsi sets that model.
#
# Scoped to the one PCM by api.alsa.path, so the speaker, headphone and mic
# nodes of the same card are untouched. SPA-JSON, WirePlumber 0.5+.

monitor.alsa.rules = [
  {
    matches = [
      {
        media.class = "Audio/Sink"
        api.alsa.path = "hw:RetroidPocket,3"
      }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
        audio.rate = 48000
        audio.channels = 2
        audio.position = [ "FL" "FR" ]
        api.alsa.disable-mmap = true
        api.alsa.period-size = 480
        api.alsa.period-num = 8
      }
    }
  }
]
