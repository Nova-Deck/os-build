# novadeck gamescope-session configuration (sourced by /usr/bin/novadeck-session, sh syntax).

# NOVADECK_SESSION_CMD — the client launched inside gamescope.
#   Phase 2: a liveness placeholder (vkcube) — there is no Steam shell yet.
#   Phase 3: replace with the native arm64 Steam shell, e.g.
#     NOVADECK_SESSION_CMD="steam -gamepadui -steamdeck -steamos3"
NOVADECK_SESSION_CMD="vkcube"

# NOVADECK_GAMESCOPE_EXTRA — extra gamescope flags appended after the HW-validated base set
# (--backend drm --use-rotation-shader -W <w> -H <h> -r <hz>). Normally empty.
NOVADECK_GAMESCOPE_EXTRA=""

# NOVADECK_GAMESCOPE_W / _H — the LANDSCAPE logical output size gamescope renders at (the panel's
# portrait native mode swapped to landscape). Leave UNSET to auto-detect from the connected DSI
# connector at runtime (falls back to 1920x1080). Pin only to override detection.
#NOVADECK_GAMESCOPE_W=1920
#NOVADECK_GAMESCOPE_H=1080

# NOVADECK_GAMESCOPE_REFRESH — output refresh in Hz (-r). sysfs does not expose the native rate, so
# this is a plain default (60); gamescope clamps to the panel's nearest supported mode.
#NOVADECK_GAMESCOPE_REFRESH=60

# NOVADECK_GAMESCOPE_OUTPUT — DRM connector to scan out (--prefer-output, e.g. DSI-1). Leave UNSET to
# auto-pick the largest connected DSI panel at runtime. Override to force a specific connector.
#NOVADECK_GAMESCOPE_OUTPUT=DSI-1
