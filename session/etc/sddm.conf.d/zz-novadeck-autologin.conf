# novadeck: boot straight into the gamescope Deck shell as the unprivileged deck user, the
# SteamOS way. SDDM logs deck in through
# PAM (pam_systemd → a real ACTIVE seat0 logind session), then launches the `novadeck` wayland
# session (/usr/share/wayland-sessions/novadeck.desktop → /usr/bin/novadeck-session). That active
# session is what lets stock polkit authorize Wi-Fi (allow_active) and timezone (subject.active &&
# wheel) — replacing the old "no-active" bypass rule.
#
# Relogin=true: if the shell exits (gamescope crash / Steam-driven restart), re-run autologin instead
# of dropping to the greeter — an appliance never shows a login screen. (The interactive greeter is
# never started, so no greeter display-server / weston is needed.)
[Autologin]
User=deck
Session=novadeck
Relogin=true

[General]
DisplayServer=wayland
